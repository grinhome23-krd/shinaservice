<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ШинаСервис — панель сотрудника</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Записи сотрудника на смене.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23f59e0b' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='3' fill='none' stroke='%23f59e0b' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0e13;--bg2:#0f131b;--card:#141924;--card2:#171d2a;
  --line:#232b3b;--line2:#2c3650;
  --text:#e9edf5;--mut:#93a0b4;--dim:#6b7890;
  --acc:#f59e0b;--acc2:#fbbf24;--acc-d:#b45309;
  --ok:#34d399;--bad:#f87171;--info:#60a5fa;
  --r:16px;--r2:11px;--sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html,body{overflow-x:clip}
[hidden]{display:none!important}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
p{margin:0 0 1em}
a{color:var(--acc2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
img{max-width:100%}
.container{max-width:1120px;margin:0 auto;padding:0 18px}
section{scroll-margin-top:86px}
/* --- header --- */
.hdr{position:sticky;top:0;z-index:50;background:rgba(11,14,19,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.3px;color:var(--text);white-space:nowrap}
.logo svg{width:30px;height:30px;color:var(--acc);flex:none}
.logo small{color:var(--dim);font-weight:600;font-size:11px;display:block;letter-spacing:.5px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{color:var(--mut);padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
.nav a:hover{color:var(--text);background:var(--card);text-decoration:none}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 11px;font-size:17px;line-height:1}
.mnav{display:none;border-top:1px solid var(--line);background:var(--bg2)}
.mnav.open{display:block}
.mnav a{display:block;padding:13px 18px;color:var(--text);font-weight:600;border-bottom:1px solid var(--line)}
.mnav a:last-child{border-bottom:none}
/* --- buttons --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;font-weight:700;padding:11px 18px;font-size:14.5px;transition:.15s;white-space:nowrap}
.btn-p{background:var(--acc);color:#161006}
.btn-p:hover{background:var(--acc2)}
.btn-o{background:transparent;border-color:var(--line2);color:var(--text)}
.btn-o:hover{border-color:var(--acc);color:var(--acc2)}
.btn-d{background:transparent;border-color:rgba(248,113,113,.4);color:var(--bad)}
.btn-d:hover{background:rgba(248,113,113,.1)}
.btn-ok{background:rgba(52,211,153,.15);color:var(--ok);border:1px solid rgba(52,211,153,.35)}
.btn-s{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* --- hero --- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(900px 420px at 85% -10%,rgba(245,158,11,.13),transparent 60%),radial-gradient(700px 380px at -10% 110%,rgba(96,165,250,.08),transparent 60%)}
.hero-in{padding:clamp(46px,8vw,90px) 0;max-width:780px;position:relative;z-index:1}
.kick{display:inline-flex;align-items:center;gap:8px;color:var(--acc2);font-weight:700;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);padding:7px 14px;border-radius:999px;margin-bottom:20px}
.hero h1{font-size:clamp(30px,5.4vw,52px);font-weight:800;margin:0 0 14px}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero-sub{color:var(--mut);font-size:clamp(15px,2vw,17.5px);max-width:580px;margin-bottom:26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.hero-chips{display:flex;gap:10px;flex-wrap:wrap}
.hchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13.5px;color:var(--dim)}
.hchip b{color:var(--text);font-weight:600}
.hero-stats{display:flex;gap:clamp(22px,4.5vw,52px);margin-top:34px;flex-wrap:wrap}
.hstat b{display:block;font-size:clamp(20px,3vw,26px)}
.hstat span{color:var(--dim);font-size:13px}
.ring{position:absolute;border-radius:50%;pointer-events:none}
.ring.r1{width:520px;height:520px;right:-150px;top:-170px;border:2px dashed rgba(245,158,11,.18)}
.ring.r2{width:340px;height:340px;right:30px;bottom:-190px;border:2px solid rgba(245,158,11,.1)}
/* --- sections --- */
.sec{padding:clamp(44px,7vw,76px) 0}
.sec.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{max-width:660px;margin-bottom:32px}
.sec-t{font-size:clamp(23px,3.4vw,32px);font-weight:800}
.sec-t em{font-style:normal;color:var(--acc)}
.sec-d{color:var(--mut);margin:0}
/* --- services grid --- */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.svc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.svc-card:hover{border-color:var(--line2);transform:translateY(-2px)}
.svc-ico{font-size:26px}
.svc-card h3{font-size:16.5px;margin:0}
.svc-card p{color:var(--mut);font-size:13.5px;margin:0;flex:1}
.svc-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.svc-price{font-weight:800;color:var(--acc2);font-size:17px}
.svc-dur{color:var(--dim);font-size:12.5px}
/* --- how steps --- */
.steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.step-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.step-n{width:34px;height:34px;border-radius:50%;background:rgba(245,158,11,.14);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:12px}
.step-card h3{font-size:15.5px}
.step-card p{color:var(--mut);font-size:13.5px;margin:0}
/* --- wizard --- */
.bk-wrap{max-width:780px;margin:0 auto}
.bk-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.prog{display:flex;border-bottom:1px solid var(--line)}
.prog-i{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 12px;color:var(--dim);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent}
.prog-i b{width:26px;height:26px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12.5px;flex:none}
.prog-i.act{color:var(--text);border-bottom-color:var(--acc)}
.prog-i.act b{background:var(--acc);color:#161006;border-color:var(--acc)}
.prog-i.done{color:var(--ok)}
.prog-i.done b{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.4);color:var(--ok)}
.bk-body{padding:clamp(16px,3vw,26px)}
.bk-nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:14px clamp(16px,3vw,26px);background:var(--bg2)}
/* selectable rows */
.svc-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;transition:.12s;background:var(--bg2)}
.svc-row:hover{border-color:var(--line2)}
.svc-row input{display:none}
.svc-row .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px}
.svc-row.on{border-color:var(--acc);background:rgba(245,158,11,.07)}
.svc-row.on .cb{background:var(--acc);border-color:var(--acc);color:#161006}
.svc-row .n{flex:1;min-width:0}
.svc-row .n b{display:block;font-size:14.5px}
.svc-row .n span{color:var(--dim);font-size:12.5px}
.svc-row .p{font-weight:700;color:var(--acc2);white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line2);margin-top:14px;padding-top:14px;font-weight:700}
.tot .t2{color:var(--mut);font-weight:500;font-size:13.5px}
/* date & slots */
.drow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.drow>div:first-child{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{background:var(--bg2);border:1px solid var(--line2);color:var(--mut);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px}
.chipbtn:hover,.chipbtn.on{border-color:var(--acc);color:var(--acc2)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.slot{position:relative;padding:11px 6px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-weight:700;font-size:14px;text-align:center;transition:.12s}
.slot:hover:not(:disabled){border-color:var(--acc)}
.slot.sel{background:var(--acc);border-color:var(--acc);color:#161006}
.slot:disabled{opacity:.3;cursor:not-allowed}
.slot .fr{position:absolute;top:3px;right:6px;font-size:9.5px;color:var(--ok);font-weight:700}
.slot.sel .fr{color:#161006}
.msg{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);color:#a9c7f5;border-radius:12px;padding:12px 14px;font-size:13.5px}
.msg.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);color:#f3c98b}
/* form */
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f-grid .full{grid-column:1/-1}
.lb{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:6px}
.lb.req::after{content:" *";color:var(--bad)}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--text);padding:11px 13px;border-radius:11px;outline:none;transition:.15s}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:74px}
select.inp-sm{width:auto;padding:7px 10px;font-size:13px;border-radius:9px}
.sumbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.sumbox .row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:14px}
.sumbox .row span{color:var(--mut)}
.sumbox .row b{text-align:right}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:14px}
.consent input{margin-top:3px;accent-color:var(--acc)}
/* success */
.okwrap{text-align:center;padding:8px 0}
.okico{width:64px;height:64px;border-radius:50%;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.4);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
.okcode{font-size:24px;font-weight:800;letter-spacing:2px;color:var(--acc2)}
/* my bookings */
.my-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.my-item .l b{display:block}
.my-item .l span{color:var(--mut);font-size:13px}
.my-item.cancelled{opacity:.55}
/* личный кабинет клиента */
.my-item.clickable{cursor:pointer;transition:.12s}
.my-item.clickable:hover{border-color:var(--line2);background:rgba(255,255,255,.03)}
.cab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 16px}
.cab-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.cab-svc-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.cab-svc-row:first-of-type{border-top:none}
.cab-svc-row b{flex:1;min-width:0}
.cab-dtl-row{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.cab-dtl-row:first-child{border-top:none}
.cab-dtl-row>span:first-child{min-width:110px;color:var(--dim);flex:none}
@media(max-width:640px){
  .cab-stats{grid-template-columns:1fr 1fr;gap:8px}
  .cab-dtl-row{flex-direction:column;gap:2px}
  .cab-dtl-row>span:first-child{min-width:0}
}
/* badges */
.st{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-new{background:rgba(245,158,11,.14);color:var(--acc2)}
.st-conf{background:rgba(96,165,250,.14);color:#9ec5fa}
.st-done{background:rgba(52,211,153,.14);color:var(--ok)}
.st-cancel{background:rgba(148,163,184,.14);color:#a9b4c6}
.st-src-on{background:rgba(96,165,250,.14);color:#9ec5fa}
.st-src-ph{background:rgba(52,211,153,.14);color:var(--ok)}
.st-swap{background:rgba(251,191,36,.16);color:#fcd34d}
/* календарь смен (админ): имя мастера в ячейке */
.cal-cell .master{font-size:11px;font-weight:700;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* faq */
.faq details{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.faq summary{padding:16px 18px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--acc);font-size:19px}
.faq details[open] summary::after{content:"–"}
.faq .faq-b{padding:0 18px 16px;color:var(--mut);font-size:14px}
/* footer */
footer{border-top:1px solid var(--line);background:var(--bg2)}
.ft-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;padding:44px 0 34px}
.ft-grid h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.ft-grid p,.ft-grid li{color:var(--mut);font-size:14px}
.ft-grid ul{list-style:none;margin:0;padding:0}
.ft-grid li{padding:4px 0}
.ft-bot{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:13px}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--card2);border:1px solid var(--line2);border-left:3px solid var(--info);border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:var(--sh);animation:tin .25s}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(4,6,10,.66);z-index:150;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--line2);border-radius:16px;width:min(600px,100%);box-shadow:var(--sh);animation:tin .2s}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h3{margin:0;font-size:17px}
.m-x{background:none;border:none;color:var(--mut);font-size:24px;line-height:1;padding:2px 8px}
.m-x:hover{color:var(--text)}
.m-body{padding:20px}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg2);border-radius:0 0 16px 16px}
/* admin */
.a-head .hdr-in{height:58px}
.a-tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.a-tabs::-webkit-scrollbar{display:none}
.a-tab{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:11px;padding:9px 16px;font-weight:700;font-size:13.5px;white-space:nowrap}
.a-tab.on{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.4);color:var(--acc2)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat span{color:var(--dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat b{display:block;font-size:26px;margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{font-size:15.5px;margin:0 0 14px}
.panel.danger{border-color:rgba(248,113,113,.35)}
.a-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start;margin-top:14px}
.trow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #1c2330}
.trow:last-child{border-bottom:none}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.chart button.cbar{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;transition:.12s;border-radius:10px}
.chart button.cbar:hover{background:rgba(255,255,255,.05)}
.chart button.cbar.today .cl{color:var(--acc2)}
.chart .cbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.chart .bar{width:100%;max-width:44px;background:linear-gradient(180deg,var(--acc),var(--acc-d));border-radius:6px 6px 2px 2px;min-height:3px}
.chart .cl{font-size:11px;color:var(--dim);white-space:nowrap}
.chart .cv{font-size:12px;color:var(--mut);font-weight:700;min-height:15px}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tb .inp{width:auto}
.tb .grow{flex:1;min-width:150px}
.tb .spacer{flex:1}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid #1c2330;font-size:13.5px;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .sub{color:var(--dim);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--dim)}
.wdays{display:flex;flex-wrap:wrap;gap:8px}
.wday{position:relative}
.wday input{position:absolute;opacity:0;pointer-events:none}
.wday span{display:inline-block;padding:8px 13px;border:1px solid var(--line2);border-radius:10px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;user-select:none}
.wday input:checked+span{border-color:var(--acc);color:var(--acc2);background:rgba(245,158,11,.08)}
.blist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bitem{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:13px}
.bitem button{background:none;border:none;color:var(--bad);font-weight:800;padding:0 2px;line-height:1}
.hint{font-size:12.5px;color:var(--dim);text-align:center;margin-top:14px}
.err{color:var(--bad);font-size:13px;margin-top:10px}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--sh)}
.login-card .logo{justify-content:center;margin-bottom:6px}
/* мастер (сотрудник): бейдж */
.emp-b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ec,#60a5fa);color:var(--ec,#60a5fa);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.emp-b i{width:7px;height:7px;border-radius:50%;background:var(--ec,#60a5fa);flex:none}
/* панель сотрудника */
.st-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.st-head h2{margin:0;font-size:clamp(20px,4.5vw,26px);font-weight:800}
.st-shift{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;border:1px solid var(--line2);background:var(--card);color:var(--mut)}
.st-shift.on{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1);color:var(--ok)}
.st-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.st-stats[hidden]{display:none}
.st-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.st-stat span{color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:block}
.st-stat b{display:block;font-size:clamp(16px,4.5vw,22px);margin-top:5px;color:var(--acc2);white-space:nowrap}
.st-stat i{display:block;font-style:normal;color:var(--dim);font-size:11.5px;margin-top:3px}
.st-filters{margin-bottom:2px}
.st-filters .chipbtn{padding:9px 13px}
.st-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.st-card.cancelled{opacity:.55}
.st-card .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.st-card .row1 .dt{font-weight:800;font-size:15px}
.st-card .row1 .dt small{display:block;font-weight:600;color:var(--dim);font-size:12px}
.st-card .cl{color:var(--mut);font-size:13.5px;margin-top:6px}
.st-card .sv{color:var(--dim);font-size:12.5px;margin-top:3px}
.st-card .money{font-weight:800;color:var(--acc2);white-space:nowrap}
.st-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.st-acts .btn{flex:1 1 130px;min-height:42px}
.bell-badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--acc);color:#161006;font-size:11.5px;font-weight:800}
/* вход сотрудника */
.emp-chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.emp-chip{flex:1 1 40%;background:var(--bg2);border:1.5px solid var(--line2);border-radius:12px;padding:13px 10px;font-weight:700;color:var(--mut);text-align:center;font-size:14.5px}
.emp-chip small{display:block;font-weight:600;font-size:11px;color:var(--dim);margin-top:2px}
.emp-chip.on{border-color:var(--acc);color:var(--acc2);background:rgba(245,158,11,.08)}
.mut-sm{font-size:12.5px;color:var(--mut);margin:0 0 10px}
.st-emp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1c2330;flex-wrap:wrap}
.st-emp-row:last-child{border-bottom:none}
.st-emp-row .nm{flex:1;min-width:140px;font-weight:700}
.st-emp-row .pin{color:var(--dim);font-size:12.5px}
/* выручка по сотрудникам */
.rev-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rev-row:first-child{border-top:none}
.rev-row .nums{display:flex;gap:8px 24px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:13px;flex:1;min-width:200px}
.rev-row .nums b{font-size:15px;color:var(--text)}
.rev-row .nums .lbl{font-size:12px;color:var(--dim);display:block}
/* итоговая строка выручки */
.rev-row.total{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px}
.tot-chip{font-weight:800;white-space:nowrap;padding:6px 12px;border-radius:10px;background:rgba(245,158,11,.14);color:var(--acc2);align-self:center}
/* календарь сотрудника */
.cal-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal-hd{text-align:center;font-size:11.5px;color:var(--dim);font-weight:700;padding:2px 0}
.cal-cell{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;min-height:64px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--text)}

.cal-cell.today{border-color:var(--acc)}

.cal-cell .d{font-weight:700;font-size:13.5px}

<script>
'use strict';
'use strict';
const TITLE_SUFFIX=(document.title||'').split(' — ').slice(1).join(' — ');
'use strict';
/* Видимая плашка при любой ошибке скрипта (чтобы сбои не были «немыми») */
window.addEventListener('error',e=>{
  try{
    const t=document.createElement('div');
    t.style.cssText='position:fixed;top:0;left:0;right:0;z-index:300;background:#7f1d1d;color:#fecaca;font:12.5px/1.4 sans-serif;padding:8px 12px';
    t.textContent='Ошибка скрипта: '+(e.message||'неизвестная')+' — сообщите об этом разработчику';
    (document.body||document.documentElement).appendChild(t);
  }catch(_){}
});
/* ================= УТИЛИТЫ ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO=()=>isoOf(new Date());
const addDaysISO=(base,n)=>{const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d);};
const toMin=t=>{const p=t.split(':');return (+p[0])*60+(+p[1]);};
const toHHMM=m=>pad2(Math.floor(m/60))+':'+pad2(m%60);
const fmtMoney=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function weekdayRu(isoStr){return WD[new Date(isoStr+'T00:00:00').getDay()];}
function fmtDateShort(isoStr){return isoStr.split('-').reverse().join('.');}
function fmtDateHuman(isoStr){const d=new Date(isoStr+'T00:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+', '+weekdayRu(isoStr);}
function fmtDT(ts){const d=new Date(ts);return d.toLocaleDateString('ru-RU')+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}

/* ================= ДАННЫЕ ================= */
const LS_KEY='shina_db_v1';
/* Безопасное хранилище: там, где доступ к localStorage/sessionStorage запрещён
   (например, изолированный предпросмотр), работаем в памяти, а не падаем. */
function makeSafeStorage(kind){
  try{
    const st=window[kind];
    st.setItem('__sm_probe__','1');
    st.removeItem('__sm_probe__');
    return {st,ok:true};
  }catch(e){
    const mem=new Map();
    return {st:{
      getItem:k=>mem.has(k)?mem.get(k):null,
      setItem:(k,v)=>{mem.set(k,String(v));},
      removeItem:k=>{mem.delete(k);}
    },ok:false};
  }
}
const LS=makeSafeStorage('localStorage');
const SS=makeSafeStorage('sessionStorage');
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return 'SM-'+s;}
function defaultDB(){
  const S=(name,cat,icon,desc,price,dur)=>({name,cat,icon,desc,price,dur,active:true});
  const services=[
    S('Сезонная смена шин (4 колеса)','Шиномонтаж','🛞','Снятие и установка колёс, без балансировки',3200,60),
    S('Смена шин + балансировка (4 колеса)','Шиномонтаж','⚙️','Комплекс: снятие, замена резины, балансировка',4800,90),
    S('Замена одной шины','Шиномонтаж','🛞','Быстрая замена одного колеса',800,20),
    S('Балансировка (4 колеса)','Шиномонтаж','⚙️','Грузики и проверка на стенде',1400,30),
    S('Ремонт прокола','Ремонт','🔧','Жгут или грибок, проверка герметичности',900,30),
    S('Ремонт бокового пореза','Ремонт','🔧','Кордовая заплатка, сложный ремонт',2600,60),
    S('Переобувка «на дисках» (4 колеса)','Шиномонтаж','🛞','Смена колёс в сборе, без разбортировки',2000,40),
    S('Сезонное хранение шин','Доп. услуги','📦','Тёплый склад, страховка, 6 месяцев',3000,15),
    S('Утилизация старых шин (4 шт.)','Доп. услуги','♻️','Официальная утилизация',600,10),
    S('Проверка давления и подкачка','Доп. услуги','🧰','Экспресс-обслуживание',0,10)
  ].map((s,i)=>Object.assign({id:i+1},s));
  const settings={companyName:'ШинаСервис',phone:'+7 (495) 120-45-67',address:'г. Москва, ул. Моторная, 12с3',
    workStart:'09:00',workEnd:'20:00',interval:60,posts:2,workDays:[1,2,3,4,5,6],blockedDates:[],adminPass:'admin123',
    adminPhone:'+7 (900) 100-00-00',panelSlug:'panel',
    employees:[
      {id:1,name:'Сергей',pin:'1111',phone:'+7 (900) 100-01-01',color:'#60a5fa',active:true},
      {id:2,name:'Андрей',pin:'2222',phone:'+7 (900) 100-02-02',color:'#fbbf24',active:true}
    ],
    shiftStart:todayISO(),shiftFirst:1,shiftOverrides:{},reportEmail:'',staffSeen:{},
    smsChannel:'sms',smsWebhook:'',ipTitle:'',
    stats:[{v:'12',t:'лет работы'},{v:'40 000+',t:'обслуженных авто'},{v:'4',t:'поста шиномонтажа'},{v:'4.9 ★',t:'рейтинг клиентов'}]};
  const t=todayISO();
  const mk=(day,time,st,name,phone,car,plate,ids,com,src)=>({
    code:genCode(),name,phone,car,plate,
    services:ids.map(i=>{const s=services.find(x=>x.id===i);return{id:s.id,name:s.name,price:s.price};}),
    date:addDaysISO(t,day),time,status:st,comment:com||'',source:src||'online',
    total:ids.reduce((a,i)=>a+services.find(x=>x.id===i).price,0),
    createdAt:Date.now()
  });
  const bookings=[
    mk(0,'11:00','confirmed','Иван Петров','+7 (916) 200-11-22','VW Tiguan','А123ВС77',[2],'','phone'),
    mk(0,'14:00','new','Мария Соколова','+7 (903) 555-30-40','Mazda CX-5','В456МК77',[1,4],'','online'),
    mk(0,'16:00','done','Алексей Морозов','+7 (925) 100-20-30','Kia Rio','Е789КХ77',[3],'','phone'),
    mk(1,'10:00','new','Дмитрий Волков','+7 (926) 777-45-67','Toyota RAV4','К012ОП77',[2,7],'Прошу позвонить перед визитом','online'),
    mk(-3,'12:00','done','Ольга Кузнецова','+7 (915) 300-40-50','Hyundai Creta','М345РС77',[2,8],'','phone')
  ];
  bookings.forEach(b=>{b.employeeId=shiftEmpFor(b.date,settings).id;b.empAuto=true;});
  return {settings,services,bookings};
}
/* --- сотрудники и смены --- */
function shiftEmpFor(dateISO,settings){
  let emps=(settings.employees||[]).filter(e=>e.active);
  if(!emps.length)return null;
  /* персональная замена на конкретную дату (календарь смен в админке) */
  const ov=(settings.shiftOverrides||{})[dateISO];
  if(ov&&ov!=='auto'){const oe=emps.find(x=>x.id===Number(ov));if(oe)return oe;}
  /* гибкий график: приоритет у сотрудников, выбравших этот день недели себе */
  const dow=new Date(dateISO+'T00:00:00').getDay();
  const flex=emps.filter(e=>e.flex&&e.flex.on&&Array.isArray(e.flex.wd)&&e.flex.wd.includes(dow));
  if(flex.length){
    const ord=Math.floor(new Date(dateISO+'T00:00:00').getTime()/86400000);
    return flex[((ord%flex.length)+flex.length)%flex.length];
  }
  const fi=emps.findIndex(e=>e.id===Number(settings.shiftFirst));
  if(fi>0)emps.unshift(emps.splice(fi,1)[0]);
  const d1=new Date(settings.shiftStart+'T00:00:00');
  const d2=new Date(dateISO+'T00:00:00');
  const diff=Math.round((d2-d1)/86400000);
  return emps[((diff%emps.length)+emps.length)%emps.length];
}
/* миграция старых/импортированных данных: сотрудники, смена, привязка записей */
function normalizeDB(d){
  const def=defaultDB();
  if(!Array.isArray(d.settings.employees)||!d.settings.employees.length)d.settings.employees=def.settings.employees;
  d.settings.employees=d.settings.employees.map((e,i)=>({
    id:Number(e.id)||i+1,name:String(e.name||'Сотрудник '+(i+1)),
    pin:String(e.pin||String(1000+i*1111)),color:e.color||['#60a5fa','#fbbf24','#34d399','#f472b6','#a78bfa'][i%5],
    phone:String(e.phone||'').slice(0,20),
    active:e.active!==false,
    flex:(e.flex&&e.flex.on)?{on:true,wd:(Array.isArray(e.flex.wd)?e.flex.wd:[]).map(Number).filter(n=>n>=0&&n<=6)}:{on:false,wd:[]}}));
  const ids=d.settings.employees.map(e=>e.id);
  if(!ids.includes(Number(d.settings.shiftFirst)))d.settings.shiftFirst=d.settings.employees[0].id;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.settings.shiftStart||''))d.settings.shiftStart=def.settings.shiftStart;
  if(!d.settings.shiftOverrides||typeof d.settings.shiftOverrides!=='object'||Array.isArray(d.settings.shiftOverrides))d.settings.shiftOverrides={};
  else Object.keys(d.settings.shiftOverrides).forEach(k=>{const v=d.settings.shiftOverrides[k];if(v!=='auto'&&!ids.includes(Number(v)))delete d.settings.shiftOverrides[k];});
  d.bookings.forEach(b=>{

let audioCtx=null;
function unlockAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=audioCtx||new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown',unlockAudio);
function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    unlockAudio();
    const ctx=audioCtx||new AC();
    const tone=(t0,f)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(f,ctx.currentTime+t0);
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(0.3,ctx.currentTime+t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t0+0.24);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+t0);o.stop(ctx.currentTime+t0+0.26);
    };
    tone(0,920);tone(0.26,1240);
  }catch(e){}
}

function freeTimesFor(dateISO,needDur,excludeCode){
  const s=DB.settings;
  if(isClosed(dateISO))return [];
  const end=toMin(s.workEnd);const dur=Math.max(30,needDur||60);
  const now=new Date();const isToday=dateISO===todayISO();
  const cutoff=isToday?now.getHours()*60+now.getMinutes()+15:-1;
  const out=[];
  for(let m=toMin(s.workStart);m<end;m+=s.interval){
    const t=toHHMM(m);
    const used=liveBookings().filter(x=>x.date===dateISO&&x.time===t&&x.code!==excludeCode).length;

function phoneMask(inp){
  let d=(inp.value||'').replace(/\D/g,'');
  if(d&&d[0]==='8')d='7'+d.slice(1);
  if(d&&d[0]!=='7')d='7'+d;
  d=d.slice(0,11);
  let out='';
  if(d.length){out='+7';
    if(d.length>1)out+=' ('+d.slice(1,4);
    if(d.length>=5)out+=') '+d.slice(4,7);
    if(d.length>=8)out+='-'+d.slice(7,9);
    if(d.length>=10)out+='-'+d.slice(9,11);
  }
  inp.value=out;
}
const phoneOk=v=>{const d=(v||'').replace(/\D/g,'');return d.length===11&&d[0]==='7';};

<script>

  const seen=(DB.settings.staffSeen||{})[e.id]||0;

  const e=staffEmp();if(!e){showLogin();return;}

  const cal=S.view==='cal';
  if(!cal){
    const wr=weekRange(),mr=monthRange();
    const fact=(label,from,to)=>
      '<div class="st-stat"><span>'+label+'</span><b>'+fmtMoney(revDone(e.id,from,to))+'</b><i>выполнено заказов: '+cntDone(e.id,from,to)+'</i></div>';
    $('#stStats').innerHTML=fact('Факт за день',t,t)+fact('Факт за неделю',wr.from,wr.to)+fact('Факт за месяц',mr.from,mr.to)+
      '<div class="st-stat"><span>Ожидается (утверждено)</span><b style="color:var(--acc2)">'+fmtMoney(expSum(e.id))+'</b><i>записей: '+expCnt(e.id)+'</i></div>';
  }
  $('#stStats').hidden=cal;
  $('#stFilters').hidden=cal;
  $('#stList').hidden=cal;
  $('#stCal').hidden=!cal;
  if(cal)renderStaffCal(e);
  const F=[['today','Сегодня'],['upcoming','Будущие'],['new','Новые'],['notif','🔔 Непросмотренные'],['done','Выполненные'],['all','Все']];
  $('#stFilters').innerHTML=F.map(f=>'<button class="chipbtn'+(S.filter===f[0]?' on':'')+'" data-stf="'+f[0]+'">'+f[1]+'</button>').join('');
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  let items=DB.bookings.filter(b=>b.employeeId===e.id);
  if(S.filter==='today')items=items.filter(b=>b.date===t&&b.status!=='cancelled');
  if(S.filter==='upcoming')items=items.filter(b=>b.date>=t&&b.status!=='cancelled');
  if(S.filter==='new')items=items.filter(b=>b.status==='new');
  if(S.filter==='notif')items=items.filter(b=>S.notifIds&&S.notifIds.has(b.code));
  if(S.filter==='done')items=items.filter(b=>b.status==='done');
  if(S.filter==='notif')items.sort((a,b)=>b.createdAt-a.createdAt);
  else items.sort((a,b)=>(S.filter==='all'?-1:1)*(a.date+a.time).localeCompare(b.date+b.time));
  $('#stList').innerHTML=items.length?items.map(b=>{
    const canAct=b.status==='new'||b.status==='confirmed';
    const act=(b.status==='new'?'<button class="btn btn-ok btn-s" data-sok="'+b.code+'">✓ Подтвердить</button>':'')+
      (b.status==='confirmed'?'<button class="btn btn-p btn-s" data-sdone="'+b.code+'">🏁 Завершить</button>':'')+
      (canAct?'<button class="btn btn-o btn-s" data-sedit="'+b.code+'">✎ Изменить</button>'+
      '<button class="btn btn-d btn-s" data-scancel="'+b.code+'">✗ Отменить</button>':'');
    return '<div class="st-card'+(b.status==='cancelled'?' cancelled':'')+'">'+
      '<div class="row1"><div class="dt">'+fmtDateShort(b.date)+' ('+weekdayRu(b.date)+') · '+b.time+'<small>'+b.code+' · '+(b.source==='phone'?'по телефону':'онлайн')+' · создана '+fmtDT(b.createdAt)+'</small></div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+stBadge(b.status)+'<span class="money">'+fmtMoney(b.total)+'</span></div></div>'+
      '<div class="cl">'+esc(b.name)+' · <a href="tel:'+b.phone.replace(/[^+\d]/g,'')+'">'+esc(b.phone)+'</a>'+(b.car?' · '+esc(b.car):'')+(b.plate?' · '+esc(b.plate):'')+'</div>'+
      '<div class="sv">'+esc(b.services.map(s=>s.name).join(' + '))+' · ≈ '+b.services.reduce((a,s)=>{const x=svcById(s.id);return a+(x?x.dur:30);},0)+' мин</div>'+
      (b.comment?'<div class="sv">💬 '+esc(b.comment)+'</div>':'')+
      noticeLine(b)+
      (act?'<div class="st-acts">'+act+'</div>':'')+
    '</div>';
  }).join(''):'<div class="empty">Записей в этом фильтре нет</div>';
}
/* --- календарный вид: месяц с загруженностью и таймлайн дня --- */
function renderStaffCal(e){
  const s=DB.settings;
  const [y,m]=S.calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const monName=(first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).charAt(0).toUpperCase())+first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).slice(1);
  const startDow=(first.getDay()+6)%7;
  const dim=new Date(y,m,0).getDate();
  const cap=Math.max(60,toMin(s.workEnd)-toMin(s.workStart));
  const durOf=b=>b.services.reduce((a,x)=>{const sv=svcById(x.id);return a+(sv?sv.dur:30);},0);
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const iso=y+'-'+pad2(m)+'-'+pad2(d);
    const items=DB.bookings.filter(b=>b.employeeId===e.id&&b.date===iso&&b.status!=='cancelled');
    const load=Math.min(100,Math.round(items.reduce((a,b)=>a+durOf(b),0)/cap*100));
    const wdow=(new Date(iso+'T00:00:00').getDay()+6)%7;
    cells+='<button type="button" class="cal-cell'+(wdow>=5?' weekend':'')+(iso===todayISO()?' today':'')+(iso===S.calDay?' sel':'')+'" data-calday="'+iso+'">'+
      '<span class="d">'+d+'</span>'+
      (items.length?'<span class="cnt">'+items.length+' запис.</span>':'<span class="cnt" style="color:var(--dim)">свободно</span>')+
      '<span class="loadbar"><i style="width:'+load+'%"></i></span>'+
    '</button>';
  }
  $('#stCal').innerHTML=
    '<div class="cal-nav">'+
      '<button class="btn btn-o btn-s" data-calnav="-1">‹</button>'+
      '<b>'+monName+'</b>'+
      '<button class="btn btn-o btn-s" data-calnav="1">›</button>'+
      '<button class="btn btn-o btn-s" data-caltoday="1">Сегодня</button>'+
      '<span class="sub" style="margin-left:auto">полоска — занятость рабочего дня ('+s.workStart+'–'+s.workEnd+')</span>'+
    '</div>'+
    '<div class="cal-grid">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<div class="cal-hd">'+x+'</div>').join('')+cells+'</div>'+
    (S.calDay?calDayTimeline(e,S.calDay):'<div class="sub" style="margin-top:12px">Выберите день — покажу записи по времени</div>');
}
function calDayTimeline(e,iso){
  const s=DB.settings;
  const items=DB.bookings.filter(b=>b.date===iso&&b.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time));
  const dayEmp=empOn(iso);
  const who=dayEmp?(dayEmp.id===e.id?'ваша смена':'смена: '+dayEmp.name):'нет активных мастеров';
  const rows=items.map(b=>{
    const endM=Math.min(toMin(s.workEnd),toMin(b.time)+b.services.reduce((a,x)=>{const sv=svcById(x.id);return a+(sv?sv.dur:30);},0));
    return '<div class="tl-row'+(b.status==='done'?' done':'')+'"><b class="tl-t">'+b.time+'–'+pad2(Math.floor(endM/60))+':'+pad2(endM%60)+'</b>'+
      '<div style="flex:1;min-width:0"><div>'+esc(b.name)+(b.car?' <span class="sub">· '+esc(b.car)+'</span>':'')+'</div>'+
      '<div class="sub">'+esc(b.services.map(x=>x.name).join(' + '))+' · '+fmtMoney(b.total)+'</div>'+
      (b.employeeId?empBadge(b.employeeId):'')+'</div>'+
      stBadge(b.status)+'</div>';
  }).join('');
  return '<div style="margin-top:14px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">'+
      '<h3 style="margin:0">Загруженность: '+fmtDateHuman(iso)+' <span class="sub">· '+who+'</span></h3>'+
      '<button class="btn btn-p btn-s" data-calbook="1" style="margin-left:auto">+ Записать на этот день</button></div>'+
    '<p class="mut-sm" style="margin-bottom:8px">Записать клиента можно в любую смену, в том числе коллеге, — мастер выбирается в форме.</p>'+
    (rows||'<div class="empty">Записей нет — день свободен</div>')+'</div>';
}
$('#stCal').addEventListener('click',e=>{
  if(e.target.closest('[data-calbook]')){openManualBooking({staff:true,date:S.calDay});return;}
  const nav=e.target.closest('[data-calnav]');
  if(nav){
    const [y,m]=S.calMonth.split('-').map(Number);
    const d=new Date(y,m-1+Number(nav.dataset.calnav),1);
    S.calMonth=d.getFullYear()+'-'+pad2(d.getMonth()+1);S.calDay=null;
    renderStaff();return;
  }
  const td=e.target.closest('[data-caltoday]');
  if(td){S.calMonth=todayISO().slice(0,7);S.calDay=todayISO();renderStaff();return;}
  const cd=e.target.closest('[data-calday]');
  if(cd){S.calDay=cd.dataset.calday;renderStaff();}
});
$('#stFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-stf]');if(!b)return;
  S.filter=b.dataset.stf;
  if(S.filter==='notif'){S.notifIds=new Set(unseenForStaff(staffEmp()).map(x=>x.code));markStaffSeen();}
  renderStaff();
});
$('#stHead').addEventListener('click',e=>{
  const v=e.target.closest('[data-stview]');
  if(v){
    S.view=v.dataset.stview;
    if(S.view==='cal'){if(!S.calMonth)S.calMonth=todayISO().slice(0,7);if(!S.calDay)S.calDay=todayISO();}
    renderStaff();return;
  }
  const b=e.target.closest('[data-stact]');if(!b)return;
  if(b.dataset.stact==='add')openManualBooking({staff:true});
  if(b.dataset.stact==='end')openShiftReport();
  if(b.dataset.stact==='bell'){
    S.filter='notif';
    S.notifIds=new Set(unseenForStaff(staffEmp()).map(x=>x.code));
    markStaffSeen();renderStaff();
  }
});
/* --- завершение смены: отчёт (текст, PDF, почта, MAX) --- */
function shiftReportText(e){
  const t=todayISO();const s=DB.settings;
  const items=DB.bookings.filter(b=>b.date===t&&b.employeeId===e.id).sort((a,b)=>a.time.localeCompare(b.time));
  const cnt=st=>items.filter(b=>b.status===st);
  const L=[];
  L.push(s.companyName+' — ОТЧЁТ ЗА СМЕНУ');
  L.push('Мастер: '+e.name);
  L.push('Дата: '+fmtDateShort(t)+' ('+weekdayRu(t)+'), время работы '+s.workStart+'–'+s.workEnd);
  L.push('──────────────────');
  L.push('Записей за смену: '+items.length);
  items.forEach((b,i)=>{
    L.push((i+1)+') '+b.time+' · '+b.name+' · '+(b.phone||'')+(b.car?' · '+b.car:'')+(b.plate?' '+b.plate:''));
    L.push('    Услуги: '+b.services.map(x=>x.name).join(' + ')+' — '+fmtMoney(b.total)+' · '+ST[b.status].t);
    if(b.comment)L.push('    Комментарий: '+b.comment);
  });
  L.push('──────────────────');
  L.push('Выполнено: '+cnt('done').length+' на '+fmtMoney(cnt('done').reduce((a,b)=>a+b.total,0)));
  L.push('Подтверждено (ожидается оплата): '+cnt('confirmed').length+' на '+fmtMoney(cnt('confirmed').reduce((a,b)=>a+b.total,0)));
  L.push('Новых (нужен звонок клиенту): '+cnt('new').length+' · Отменено: '+cnt('cancelled').length);
  L.push('Отчёт сформирован автоматически: '+fmtDT(Date.now()));
  return L.join('\n');
}
function printShiftReport(e){
  const t=todayISO();const s=DB.settings;
  const items=DB.bookings.filter(b=>b.date===t&&b.employeeId===e.id).sort((a,b)=>a.time.localeCompare(b.time));
  const sum=st=>items.filter(b=>b.status===st).reduce((a,b)=>a+b.total,0);
  const rows=items.map(b=>
    '<tr><td class="num">'+b.time+'</td><td><b>'+esc(b.name)+'</b><br><span style="font-size:10pt;color:#444">'+esc(b.phone)+(b.car?' · '+esc(b.car):'')+(b.plate?' · '+esc(b.plate):'')+'</span></td>'+
    '<td>'+esc(b.services.map(x=>x.name).join(' + '))+'</td><td class="price">'+fmtMoney(b.total)+'</td><td>'+ST[b.status].t+'</td></tr>').join('')||
    '<tr><td colspan="5" style="text-align:center;color:#777">Записей за смену нет</td></tr>';
  $('#printSheet').innerHTML=
    '<div class="ps-doc">'+
      '<div class="ps-co">'+esc(s.companyName)+'</div>'+
      '<div class="ps-contacts">'+esc(s.address)+' · тел. '+esc(s.phone)+'</div>'+
      '<h1>Отчёт за смену · '+fmtDateShort(t)+' ('+weekdayRu(t)+')</h1>'+
      '<p style="font-size:11pt">Мастер: <b>'+esc(e.name)+'</b> · время работы: '+s.workStart+'–'+s.workEnd+'</p>'+
      '<table class="ps-table"><thead><tr><th class="num">Время</th><th>Клиент</th><th>Услуги</th><th class="price">Сумма</th><th>Статус</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<table class="ps-table" style="margin-top:10px"><tbody>'+
        '<tr><td>Выполнено</td><td class="price">'+items.filter(b=>b.status==='done').length+' × '+fmtMoney(sum('done'))+'</td></tr>'+
        '<tr><td>Подтверждено (ожидается оплата)</td><td class="price">'+items.filter(b=>b.status==='confirmed').length+' × '+fmtMoney(sum('confirmed'))+'</td></tr>'+
        '<tr><td>Новые / отменённые</td><td class="price">'+items.filter(b=>b.status==='new').length+' / '+items.filter(b=>b.status==='cancelled').length+'</td></tr>'+
      '</tbody></table>'+
      '<div class="ps-foot"><div class="ps-sign"><div class="ln">Мастер ______________________ /'+esc(e.name)+'/<br><span style="font-size:9pt;color:#555">подпись</span></div></div></div>'+
    '</div>';
  window.print();
}
function sendMaxReport(text,btn){
  const url=(DB.settings.smsWebhook||'').trim();
  if(!url){toast('MAX-шлюз не настроен — Настройки → «Уведомления клиентам»','err');return;}
  if(btn){btn.disabled=true;btn.textContent='Отправка…';}
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({channel:'max',phone:DB.settings.phone,text:text,code:'shift-report',kind:'shift-report'})})
    .then(r=>{
      toast(r.ok?'💬 Отчёт отправлен администратору в MAX':'Шлюз вернул ошибку при отправке в MAX',r.ok?'':'err');
      if(btn){btn.disabled=false;btn.textContent='💬 Отправить в MAX';}
    })
    .catch(()=>{
      toast('Не удалось связаться со шлюзом MAX','err');
      if(btn){btn.disabled=false;btn.textContent='💬 Отправить в MAX';}
    });
}
function mailReport(text,e){
  const em=(DB.settings.reportEmail||'').trim();
  if(!em){toast('Укажите почту для отчётов — Настройки → «Данные автосервиса»','err');return;}
  location.href='mailto:'+em+'?subject='+encodeURIComponent('Отчёт за смену '+fmtDateShort(todayISO())+' — '+e.name)+'&body='+encodeURIComponent(text);
}
function openShiftReport(){
  const e=staffEmp();if(!e)return;
  const t=todayISO();
  const text=shiftReportText(e);
  const items=DB.bookings.filter(b=>b.date===t&&b.employeeId===e.id);
  const hasMail=!!(DB.settings.reportEmail||'').trim();
  const hasHook=!!(DB.settings.smsWebhook||'').trim();
  openModal(
    '<div class="m-head"><h3>🏁 Завершение смены · '+fmtDateShort(t)+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body">'+
      '<p class="mut-sm">Смена мастера <b>'+esc(e.name)+'</b>, записей за день: '+items.length+'. '+
        (hasHook?'Отчёт отправлен в MAX администратору. ':'MAX-шлюз не настроен — отправьте кнопкой «💬 Отправить в MAX». ')+
        (hasMail?'Почтовый клиент открыт с письмом для '+esc(DB.settings.reportEmail)+'.':'Почта для отчётов не указана (Настройки → «Данные автосервиса»).')+'</p>'+
      '<pre style="white-space:pre-wrap;font-size:12.5px;line-height:1.5;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:260px;overflow:auto;margin:10px 0">'+esc(text)+'</pre>'+
      '<p class="mut-sm">PDF: в диалоге печати браузера выберите «Сохранить как PDF».</p>'+
    '</div>'+
    '<div class="m-foot" style="flex-wrap:wrap">'+
      '<button class="btn btn-p" id="srPdf">📄 PDF</button>'+
      '<button class="btn btn-o" id="srMail">✉️ На почту</button>'+
      '<button class="btn btn-o" id="srMax">💬 Отправить в MAX</button>'+
      '<button class="btn btn-o" data-mx>Закрыть</button>'+
    '</div>');
  $('#srPdf').onclick=()=>printShiftReport(e);
  $('#srMail').onclick=()=>mailReport(text,e);
  $('#srMax').onclick=ev=>sendMaxReport(text,ev.currentTarget);
  if(hasHook)sendMaxReport(text,null);
  if(hasMail)mailReport(text,e);
}
$('#stList').addEventListener('click',e=>{
  const ok=e.target.closest('[data-sok]'),dn=e.target.closest('[data-sdone]'),ed=e.target.closest('[data-sedit]'),cn=e.target.closest('[data-scancel]');
  const code=(ok&&ok.dataset.sok)||(dn&&dn.dataset.sdone)||(ed&&ed.dataset.sedit)||(cn&&cn.dataset.scancel);
  const b=DB.bookings.find(x=>x.code===code);if(!b)return;
  if(ok){b.status='confirmed';notifyClient(b,'confirmed');save();renderStaff();toast(b.code+' подтверждена · клиенту отправлено '+clientChannel());}
  if(dn){b.status='done';save();renderStaff();toast(b.code+' выполнена — молодец!');}
  if(ed)openBookingEdit(b.code,{staff:true});
  if(cn){openConfirm('Отменить запись?','Запись <b>'+b.code+'</b> ('+esc(b.name)+') на '+fmtDateHuman(b.date)+', '+b.time+' будет отменена, клиент получит уведомление.','Отменить',()=>{
    b.status='cancelled';notifyClient(b,'cancelled');save();renderStaff();toast('Запись отменена · клиент уведомлён');});}
});
</script>
<script>
'use strict';
/* --- отдельная страница сотрудника (staff.html): вход только с сессией --- */
function showSite(){location.href='index.html';}
function showLogin(){SS.st.removeItem('sm_staff');SS.st.removeItem('sm_code');SS.st.removeItem('sm_token');location.replace('panel.html');}
$('#stSite').addEventListener('click',showSite);
$('#stLogout').addEventListener('click',()=>{SS.st.removeItem('sm_staff');SS.st.removeItem('sm_code');SS.st.removeItem('sm_token');showSite();toast('Вы вышли из панели');});
$('#ftYear').textContent=new Date().getFullYear();
window.addEventListener('storage',e=>{
  if(e.key&&e.key!==LS_KEY)return;
  DB=loadDB();
  notifWatch();
  if(isStaff()&&!document.querySelector('.modal-box'))renderStaff();
});
(async()=>{
  applySettings();
  if(await srvDetect()){
    SRV.mode=true;
    const j=await srvFetch('/api/state').then(r=>r.json()).catch(()=>null);
    if(j&&j.ok&&j.db)mergeState(j.db);
    else if(j&&j.empty){await srvFetch('/api/init',{method:'POST',body:JSON.stringify({db:DB})}).catch(()=>{});}
    const tk=SS.st.getItem('sm_token');
    if(tk){
      const r2=await srvFetch('/api/db?token='+encodeURIComponent(tk)).then(r=>r.json()).catch(()=>null);
      if(r2&&r2.ok&&r2.db){mergeState(r2.db);SRV.authed='t:'+tk;SRV.updated=r2.updated;
        if(r2.role==='admin')SS.st.setItem('sm_admin','1');
        else if(r2.role!=='client')SS.st.setItem('sm_staff',String(r2.role));
      }else SS.st.removeItem('sm_token');
    }
    const sc=SS.st.getItem('sm_code');
    if(sc){
      const r3=await srvFetch('/api/db?code='+encodeURIComponent(sc)).then(r=>r.json()).catch(()=>null);
      if(r3&&r3.ok&&r3.db){mergeState(r3.db);SRV.authed=sc;SRV.updated=r3.updated;
        if(r3.role==='admin')SS.st.setItem('sm_admin','1');
        else if(r3.role!=='client')SS.st.setItem('sm_staff',String(r3.role));
      }else SS.st.removeItem('sm_code');
    }
    if(!SRV.authed)SS.st.removeItem('sm_staff');
    setInterval(srvSync,15000);
  }
  if(isStaff())enterStaff(false);
  else showLogin();
})();

</script>
