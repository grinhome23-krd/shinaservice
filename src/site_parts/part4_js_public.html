function fmtDateShort(isoStr){return isoStr.split('-').reverse().join('.');}
function fmtDateHuman(isoStr){const d=new Date(isoStr+'T00:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+', '+weekdayRu(isoStr);}

/* Безопасное хранилище: там, где доступ к localStorage/sessionStorage запрещён
   (например, изолированный предпросмотр), работаем в памяти, а не падаем. */
function makeSafeStorage(kind){
  try{
    const st=window[kind];
    st.setItem('__sm_probe__','1');
    st.removeItem('__sm_probe__');
    return {st,ok:true};
  }catch(e){
    const mem=new Map();
    return {st:{
      getItem:k=>mem.has(k)?mem.get(k):null,
      setItem:(k,v)=>{mem.set(k,String(v));},
      removeItem:k=>{mem.delete(k);}
    },ok:false};
  }
}

/* --- сотрудники и смены --- */
function shiftEmpFor(dateISO,settings){
  let emps=(settings.employees||[]).filter(e=>e.active);
  if(!emps.length)return null;
  const fi=emps.findIndex(e=>e.id===Number(settings.shiftFirst));
  if(fi>0)emps.unshift(emps.splice(fi,1)[0]);
  const d1=new Date(settings.shiftStart+'T00:00:00');
  const d2=new Date(dateISO+'T00:00:00');
  const diff=Math.round((d2-d1)/86400000);
  return emps[((diff%emps.length)+emps.length)%emps.length];
}
/* миграция старых/импортированных данных: сотрудники, смена, привязка записей */
function normalizeDB(d){
  const def=defaultDB();
  if(!Array.isArray(d.settings.employees)||!d.settings.employees.length)d.settings.employees=def.settings.employees;
  d.settings.employees=d.settings.employees.map((e,i)=>({
    id:Number(e.id)||i+1,name:String(e.name||'Сотрудник '+(i+1)),
    pin:String(e.pin||String(1000+i*1111)),color:e.color||['#60a5fa','#fbbf24','#34d399','#f472b6','#a78bfa'][i%5],
    active:e.active!==false}));
  const ids=d.settings.employees.map(e=>e.id);
  if(!ids.includes(Number(d.settings.shiftFirst)))d.settings.shiftFirst=d.settings.employees[0].id;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.settings.shiftStart||''))d.settings.shiftStart=def.settings.shiftStart;
  d.bookings.forEach(b=>{
    if(!b.employeeId||!ids.includes(b.employeeId)){
      const e=shiftEmpFor(b.date,d.settings);
      b.employeeId=e?e.id:d.settings.employees[0].id;
    }
    if(b.empAuto===undefined)b.empAuto=true;
    if(!b.source)b.source='online';
  });
  if(!d.settings.staffSeen||typeof d.settings.staffSeen!=='object')d.settings.staffSeen={};
  if(!Array.isArray(d.settings.stats))d.settings.stats=defaultDB().settings.stats;
  else d.settings.stats=d.settings.stats.map(x=>({v:String((x&&x.v)||'').slice(0,40),t:String((x&&x.t)||'').slice(0,60)})).filter(x=>x.v);
  return d;
}

function loadDB(){

        d.settings=Object.assign(defaultDB().settings,d.settings);
        return normalizeDB(d);
      }
    }
  }catch(e){}
  const d=defaultDB();
  try{LS.st.setItem(LS_KEY,JSON.stringify(d));}catch(e){}
  return d;
}

function monthRange(){const t=todayISO();return{from:t.slice(0,8)+'01',to:t};}
/* свободные слоты при редактировании (исключая саму запись) */
function freeTimesFor(dateISO,needDur,excludeCode){
  const s=DB.settings;
  if(isClosed(dateISO))return [];
  const end=toMin(s.workEnd);const dur=Math.max(30,needDur||60);
  const now=new Date();const isToday=dateISO===todayISO();
  const cutoff=isToday?now.getHours()*60+now.getMinutes()+15:-1;
  const out=[];
  for(let m=toMin(s.workStart);m<end;m+=s.interval){
    const t=toHHMM(m);
    const used=liveBookings().filter(x=>x.date===dateISO&&x.time===t&&x.code!==excludeCode).length;
    if((m>cutoff)&&(s.posts-used>0)&&(m+dur<=end))out.push(t);
  }
  return out;
}
const liveBookings=()=>DB.bookings.filter(b=>b.status!=='cancelled');
const activeAt=(date,time)=>liveBookings().filter(b=>b.date===date&&b.time===time).length;
function isClosed(dateISO){
  const s=DB.settings;
  const dow=new Date(dateISO+'T00:00:00').getDay();
  if(!s.workDays.includes(dow))return true;
  return (s.blockedDates||[]).includes(dateISO);
}
function daySlots(dateISO,needDur){
  const s=DB.settings;
  if(isClosed(dateISO))return [];
  const out=[];const end=toMin(s.workEnd);
  const now=new Date();const isToday=dateISO===todayISO();
  const cutoff=isToday?now.getHours()*60+now.getMinutes()+15:-1;
  const dur=Math.max(30,needDur||60);
  for(let m=toMin(s.workStart);m<end;m+=s.interval){
    const free=s.posts-activeAt(dateISO,toHHMM(m));
    const blocked=(m<=cutoff)||(free<=0)||(m+dur>end);
    out.push({t:toHHMM(m),free,blocked});
  }
  return out;
}
function slotAvailable(dateISO,time,needDur,excludeCode){
  const s=DB.settings;
  if(isClosed(dateISO))return false;
  const m=toMin(time);const end=toMin(s.workEnd);
  const dur=Math.max(30,needDur||60);
  if(m<toMin(s.workStart)||m+dur>end)return false;
  const now=new Date();
  if(dateISO===todayISO()&&m<=now.getHours()*60+now.getMinutes()+15)return false;
  const used=liveBookings().filter(b=>b.date===dateISO&&b.time===time&&b.code!==excludeCode).length;
  return used<s.posts;
}

function copyText(txt,okMsg){
  const done=()=>toast(okMsg||'Текст скопирован');
  const fallback=()=>{
    const ta=document.createElement('textarea');ta.value=txt;
    ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('Не удалось скопировать','err');}
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fallback);
  else fallback();
}
const escIcs=v=>String(v).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;');
function downloadIcs(b){
  const dur=Math.max(30,b.services.reduce((a,x)=>{const s=svcById(x.id);return a+(s?s.dur:30);},0));
  const endM=Math.min(toMin(b.time)+dur,23*60+59);
  const day=b.date.replace(/-/g,'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ShinaService//RU','BEGIN:VEVENT',
    'UID:'+b.code+'@shinaservice',
    'DTSTART:'+day+'T'+b.time.replace(':','')+'00',
    'DTEND:'+day+'T'+toHHMM(endM).replace(':','')+'00',
    'SUMMARY:'+escIcs(DB.settings.companyName+' — шиномонтаж'),
    'DESCRIPTION:'+escIcs(b.services.map(x=>x.name).join(', ')+' · '+fmtMoney(b.total)+' · код '+b.code),
    'LOCATION:'+escIcs(DB.settings.address),
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.code+'.ics';
  document.body.appendChild(a);a.click();a.remove();
  toast('Напоминание сохранено в календарь');
}
function hoursText(){
  const s=DB.settings;const d=Array.from(new Set(s.workDays)).sort((a,b)=>a-b);
  if(d.length===7)return 'Ежедневно '+s.workStart+'–'+s.workEnd;
  if(!d.length)return 'График уточняйте по телефону';
  const n=WD;let parts=[];let start=d[0],prev=d[0];
  for(let i=1;i<=d.length;i++){
    if(d[i]===prev+1){prev=d[i];continue;}
    parts.push(start===prev?n[start]:n[start]+'–'+n[prev]);
    start=d[i];prev=d[i];
  }
  return parts.join(', ')+': '+s.workStart+'–'+s.workEnd;
}

function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast '+(type||'ok');
  el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='.3s';el.style.opacity='0';setTimeout(()=>el.remove(),320);},3400);
}

function phoneMask(inp){
  let d=(inp.value||'').replace(/\D/g,'');
  if(d&&d[0]==='8')d='7'+d.slice(1);
  if(d&&d[0]!=='7')d='7'+d;
  d=d.slice(0,11);
  let out='';
  if(d.length){out='+7';
    if(d.length>1)out+=' ('+d.slice(1,4);
    if(d.length>=5)out+=') '+d.slice(4,7);
    if(d.length>=8)out+='-'+d.slice(7,9);
    if(d.length>=10)out+='-'+d.slice(9,11);
  }
  inp.value=out;
}
const phoneOk=v=>{const d=(v||'').replace(/\D/g,'');return d.length===11&&d[0]==='7';};

  if(!list.length)return '<div class="msg warn">Услуги временно недоступны. Позвоните нам: <a class="js-phone" href="#"></a></div>';
  return list.map(s=>
    '<label class="svc-row '+(bk.services.has(s.id)?'on':'')+'">'+
      '<input type="checkbox" data-svc="'+s.id+'" '+(bk.services.has(s.id)?'checked':'')+'>'+
      '<span class="cb">✓</span>'+
      '<span class="n"><b>'+esc(s.name)+'</b><span>'+esc(s.desc||'')+' · ≈ '+s.dur+' мин</span></span>'+
      '<span class="p">'+(s.price===0?'0 ₽':fmtMoney(s.price))+'</span>'+
    '</label>').join('')+totHtml();
}
function step2Html(){
  return '<div class="drow">'+
    '<div><label class="lb req">Дата визита</label><input type="date" id="bkDate" class="inp" min="'+todayISO()+'" value="'+bk.date+'"></div>'+
    '<div class="chips"><button type="button" class="chipbtn" data-qd="0">Сегодня</button><button type="button" class="chipbtn" data-qd="1">Завтра</button></div>'+
  '</div><div id="slotArea"></div>';
}
function step3Html(){
  const l=selList();const c=selCalc();
  return '<div class="sumbox">'+
    '<div class="row"><span>Услуги</span><b>'+esc(l.map(s=>s.name).join(' + '))+'</b></div>'+
    '<div class="row"><span>Дата и время</span><b>'+fmtDateHuman(bk.date)+', '+bk.time+'</b></div>'+
    '<div class="row"><span>Длительность</span><b>≈ '+c.dur+' мин</b></div>'+
    '<div class="row"><span>К оплате</span><b style="color:var(--acc2)">'+fmtMoney(c.total)+'</b></div>'+
  '</div>'+
  '<div class="f-grid">'+
    '<div><label class="lb req">Ваше имя</label><input id="bkName" class="inp" placeholder="Иван" value="'+esc(bk.name)+'"></div>'+
    '<div><label class="lb req">Телефон</label><input id="bkPhone" class="inp" inputmode="tel" placeholder="+7 (___) ___-__-__" value="'+esc(bk.phone)+'"></div>'+
    '<div><label class="lb">Автомобиль</label><input id="bkCar" class="inp" placeholder="Kia Rio" value="'+esc(bk.car)+'"></div>'+
    '<div><label class="lb">Госномер</label><input id="bkPlate" class="inp" placeholder="А123ВС77" value="'+esc(bk.plate)+'"></div>'+
    '<div class="full"><label class="lb">Комментарий</label><textarea id="bkCom" class="inp" placeholder="Например: шины лежат в багажнике">'+esc(bk.comment)+'</textarea></div>'+
  '</div>'+
  '<label class="consent"><input type="checkbox" id="bkAgree" '+(bk.agree?'checked':'')+'><span>Согласен(на) на обработку персональных данных и на подтверждение записи по телефону.</span></label>';
}
function renderSlots(){
  const area=$('#slotArea');if(!area)return;
  if(!bk.date){area.innerHTML='<div class="msg">Выберите дату визита — покажем свободное время.</div>';return;}
  if(isClosed(bk.date)){area.innerHTML='<div class="msg warn">'+fmtDateHuman(bk.date)+' — нерабочий день. Выберите другую дату или позвоните нам: <a class="js-phone" href="#"></a></div>';applySettings();return;}
  const c=selCalc();
  const slots=daySlots(bk.date,c.dur);
  const freeSlots=slots.filter(s=>!s.blocked);
  let h='<div class="lb" style="margin-bottom:8px">Свободное время · визит ≈ '+c.dur+' мин</div>';
  if(!freeSlots.length){
    h+='<div class="msg warn">На '+fmtDateHuman(bk.date)+' свободных слотов нет. Выберите другую дату или позвоните нам.</div>';
  }else{
    h+='<div class="slots">'+slots.map(s=>
      '<button type="button" class="slot '+(bk.time===s.t?'sel':'')+'" data-t="'+s.t+'" '+(s.blocked?'disabled title="Занято или время прошло"':'')+'>'+s.t+
      ((!s.blocked&&s.free<DB.settings.posts)?'<span class="fr">'+s.free+'</span>':'')+'</button>').join('')+'</div>';
  }
  area.innerHTML=h;
}
function renderStep(){
  renderProg();
  const p=$('#bkPane');
  $('#bkBack').style.visibility=bk.step===1?'hidden':'visible';
  $('#bkNext').textContent=bk.step===3?'Подтвердить запись':'Далее →';
  if(bk.step===1){
    p.innerHTML=step1Html();
    if(bk.step===1&&p.querySelector('.js-phone'))applySettings();
    p.querySelectorAll('[data-svc]').forEach(ch=>{
      ch.addEventListener('change',()=>{
        const id=Number(ch.dataset.svc);
        if(ch.checked)bk.services.add(id);else bk.services.delete(id);
        renderStep();
      });
    });
  }else if(bk.step===2){
    p.innerHTML=step2Html();
    $('#bkDate').addEventListener('change',e=>{bk.date=e.target.value||'';bk.time='';renderSlots();});
    p.querySelectorAll('[data-qd]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        bk.date=addDaysISO(todayISO(),Number(btn.dataset.qd));bk.time='';
        $('#bkDate').value=bk.date;renderSlots();
      });
    });
    renderSlots();
  }else if(bk.step===3){
    p.innerHTML=step3Html();
    $('#bkName').addEventListener('input',e=>bk.name=e.target.value);
    $('#bkPhone').addEventListener('input',e=>{phoneMask(e.target);bk.phone=e.target.value;});
    $('#bkCar').addEventListener('input',e=>bk.car=e.target.value);
    $('#bkPlate').addEventListener('input',e=>bk.plate=e.target.value);
    $('#bkCom').addEventListener('input',e=>bk.comment=e.target.value);
    $('#bkAgree').addEventListener('change',e=>bk.agree=e.target.checked);
  }
}
function goNext(){
  if(bkDone){return;}
  if(bk.step===1){
    if(!bk.services.size){toast('Выберите хотя бы одну услугу','err');return;}
    bk.step=2;renderStep();
  }else if(bk.step===2){
    if(!bk.date){toast('Выберите дату визита','err');return;}
    if(!bk.time){toast('Выберите время визита','err');return;}
    bk.step=3;renderStep();
  }else submitBooking();
}
function goBack(){if(bkDone)return;if(bk.step>1){bk.step--;renderStep();}}
$('#bkPane').addEventListener('click',e=>{
  const b=e.target.closest('.slot:not(:disabled)');
  if(!b)return;
  bk.time=b.dataset.t;
  $$('#bkPane .slot').forEach(x=>x.classList.toggle('sel',x===b));
});
$('#bkBack').addEventListener('click',goBack);
$('#bkNext').addEventListener('click',goNext);
function submitBooking(){
  const name=(bk.name||'').trim();
  if(name.length<2){toast('Укажите имя (минимум 2 буквы)','err');return;}
  if(!phoneOk(bk.phone)){toast('Укажите телефон в формате +7 XXX XXX-XX-XX','err');return;}
  if(!bk.agree){toast('Подтвердите согласие на обработку данных','err');return;}
  const c=selCalc();
  if(!slotAvailable(bk.date,bk.time,c.dur)){
    toast('Это время уже занято — выберите другое','err');
    bk.step=2;bk.time='';renderStep();return;
  }
  const l=selList();
  const emp=empOn(bk.date);
  const b={code:genCode(),name,phone:bk.phone,car:(bk.car||'').trim(),plate:(bk.plate||'').trim().toUpperCase(),
    services:l.map(s=>({id:s.id,name:s.name,price:s.price})),
    date:bk.date,time:bk.time,comment:(bk.comment||'').trim(),
    total:l.reduce((a,s)=>a+s.price,0),status:'new',createdAt:Date.now(),source:'online',
    employeeId:emp?emp.id:null,empAuto:true};
  DB.bookings.push(b);save();
  showSuccess(b);
}
function showSuccess(b){
  bkDone=true;renderProg();
  $('#bkPane').innerHTML=
    '<div class="okwrap">'+
      '<div class="okico">✓</div>'+
      '<h3 style="margin-bottom:2px">Вы записаны!</h3>'+
      '<div class="okcode">'+b.code+'</div>'+
      '<p style="color:var(--mut);max-width:440px;margin:10px auto 18px">Администратор перезвонит на '+esc(b.phone)+' для подтверждения. Сохраните код записи — он пригодится в разделе «Мои записи».</p>'+
      '<div class="sumbox" style="text-align:left;margin-bottom:0">'+
        '<div class="row"><span>Дата и время</span><b>'+fmtDateHuman(b.date)+', '+b.time+'</b></div>'+
        '<div class="row"><span>Услуги</span><b>'+esc(b.services.map(s=>s.name).join(' + '))+'</b></div>'+
        (empById(b.employeeId)?'<div class="row"><span>Ваш мастер</span><b>'+esc(empById(b.employeeId).name)+'</b></div>':'')+
        '<div class="row"><span>Сумма</span><b>'+fmtMoney(b.total)+'</b></div>'+
      '</div>'+
      '<p class="hint" style="margin-top:14px">Уведомления: сохраните визит в календарь телефона или отправьте подтверждение себе в мессенджер.</p>'+
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px">'+
        '<button class="btn btn-o btn-s" id="okIcs">📅 В календарь</button>'+
        '<button class="btn btn-o btn-s" id="okWa">💬 WhatsApp</button>'+
        '<button class="btn btn-o btn-s" id="okTg">✈️ Telegram</button>'+
      '</div>'+
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">'+
        '<button class="btn btn-o" id="okAgain">Записать ещё</button>'+
        '<button class="btn btn-p" id="okMy">Мои записи</button>'+
      '</div>'+
    '</div>';
  $('#bkNav').style.display='none';
  $('#okAgain').addEventListener('click',()=>{resetBk();document.getElementById('booking').scrollIntoView();});
  $('#okMy').addEventListener('click',()=>{$('#myPhone').value=b.phone;findMy();document.getElementById('my').scrollIntoView();});
  $('#okIcs').addEventListener('click',()=>downloadIcs(b));
  $('#okWa').addEventListener('click',()=>window.open(waLink('',clientMsg(b)),'_blank','noopener'));
  $('#okTg').addEventListener('click',()=>window.open(tgLink(clientMsg(b)),'_blank','noopener'));
}
function resetBk(){
  bk.step=1;bk.services=new Set();bk.date='';bk.time='';bk.agree=false;
  bkDone=false;$('#bkNav').style.display='';
  renderStep();
}
function chooseService(id){
  bk.services.add(Number(id));
  bkDone=false;bk.step=1;$('#bkNav').style.display='';
  renderStep();
  document.getElementById('booking').scrollIntoView();
  toast('Услуга добавлена в запись');
}

/* --- мои записи --- */
function findMy(){
  const wrap=$('#myList');
  const dig=($('#myPhone').value||'').replace(/\D/g,'');
  if(dig.length!==11||dig[0]!=='7'){wrap.innerHTML='<div class="msg warn" style="max-width:640px">Введите телефон в формате +7 XXX XXX-XX-XX — как при записи.</div>';return;}
  const items=DB.bookings.filter(b=>b.phone.replace(/\D/g,'')===dig).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  if(!items.length){wrap.innerHTML='<div class="msg">По этому телефону записей не найдено. Проверьте номер или создайте новую запись выше.</div>';return;}
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  wrap.innerHTML=items.map(b=>{
    const future=b.date>todayISO()||(b.date===todayISO()&&toMin(b.time)>nowM);
    const canCancel=(b.status==='new'||b.status==='confirmed')&&future;
    return '<div class="my-item '+(b.status==='cancelled'?'cancelled':'')+'">'+
      '<div class="l"><b>'+fmtDateShort(b.date)+' ('+weekdayRu(b.date)+') в '+b.time+' · '+b.code+'</b>'+
      '<span>'+esc(b.services.map(s=>s.name).join(' + '))+' · '+fmtMoney(b.total)+'</span></div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+stBadge(b.status)+
      (canCancel?'<button class="btn btn-d btn-s" data-cancel="'+b.code+'">Отменить</button>':'')+
      '</div></div>';
  }).join('');
}
$('#myPhone').addEventListener('input',e=>phoneMask(e.target));
$('#myPhone').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();findMy();}});
$('#myFind').addEventListener('click',findMy);
$('#myList').addEventListener('click',e=>{
  const btn=e.target.closest('[data-cancel]');if(!btn)return;
  const b=DB.bookings.find(x=>x.code===btn.dataset.cancel);if(!b)return;
  openConfirm('Отменить запись?','Запись <b>'+b.code+'</b> на '+esc(fmtDateHuman(b.date))+', '+b.time+' будет отменена.','Да, отменить',()=>{
    b.status='cancelled';save();findMy();toast('Запись отменена');
  });
});
/* делегирование: выбрать услугу из сетки */
$('#svcGrid').addEventListener('click',e=>{
  const btn=e.target.closest('[data-choose]');if(!btn)return;
  chooseService(btn.dataset.choose);
});
</script>
