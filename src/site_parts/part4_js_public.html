/* ================= УТИЛИТЫ ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO=()=>isoOf(new Date());
const addDaysISO=(base,n)=>{const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d);};
const toMin=t=>{const p=t.split(':');return (+p[0])*60+(+p[1]);};
const toHHMM=m=>pad2(Math.floor(m/60))+':'+pad2(m%60);
const fmtMoney=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function weekdayRu(isoStr){return WD[new Date(isoStr+'T00:00:00').getDay()];}
function fmtDateShort(isoStr){return isoStr.split('-').reverse().join('.');}
function fmtDateHuman(isoStr){const d=new Date(isoStr+'T00:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+', '+weekdayRu(isoStr);}
function fmtDT(ts){const d=new Date(ts);return d.toLocaleDateString('ru-RU')+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}

/* Безопасное хранилище: там, где доступ к localStorage/sessionStorage запрещён
   (например, изолированный предпросмотр), работаем в памяти, а не падаем. */
function makeSafeStorage(kind){
  try{
    const st=window[kind];
    st.setItem('__sm_probe__','1');
    st.removeItem('__sm_probe__');
    return {st,ok:true};
  }catch(e){
    const mem=new Map();
    return {st:{
      getItem:k=>mem.has(k)?mem.get(k):null,
      setItem:(k,v)=>{mem.set(k,String(v));},
      removeItem:k=>{mem.delete(k);}
    },ok:false};
  }
}
const LS=makeSafeStorage('localStorage');
const SS=makeSafeStorage('sessionStorage');

/* --- сотрудники и смены --- */
function shiftEmpFor(dateISO,settings){
  let emps=(settings.employees||[]).filter(e=>e.active);
  if(!emps.length)return null;
  /* персональная замена на конкретную дату (календарь смен в админке) */
  const ov=(settings.shiftOverrides||{})[dateISO];
  if(ov&&ov!=='auto'){const oe=emps.find(x=>x.id===Number(ov));if(oe)return oe;}
  /* гибкий график: приоритет у сотрудников, выбравших этот день недели себе */
  const dow=new Date(dateISO+'T00:00:00').getDay();
  const flex=emps.filter(e=>e.flex&&e.flex.on&&Array.isArray(e.flex.wd)&&e.flex.wd.includes(dow));
  if(flex.length){
    const ord=Math.floor(new Date(dateISO+'T00:00:00').getTime()/86400000);
    return flex[((ord%flex.length)+flex.length)%flex.length];
  }
  const fi=emps.findIndex(e=>e.id===Number(settings.shiftFirst));
  if(fi>0)emps.unshift(emps.splice(fi,1)[0]);
  const d1=new Date(settings.shiftStart+'T00:00:00');
  const d2=new Date(dateISO+'T00:00:00');
  const diff=Math.round((d2-d1)/86400000);
  return emps[((diff%emps.length)+emps.length)%emps.length];
}
/* миграция старых/импортированных данных: сотрудники, смена, привязка записей */
function normalizeDB(d){
  const def=defaultDB();
  if(!Array.isArray(d.settings.employees)||!d.settings.employees.length)d.settings.employees=def.settings.employees;
  d.settings.employees=d.settings.employees.map((e,i)=>({
    id:Number(e.id)||i+1,name:String(e.name||'Сотрудник '+(i+1)),
    pin:String(e.pin||String(1000+i*1111)),color:e.color||['#60a5fa','#fbbf24','#34d399','#f472b6','#a78bfa'][i%5],
    active:e.active!==false,
    flex:(e.flex&&e.flex.on)?{on:true,wd:(Array.isArray(e.flex.wd)?e.flex.wd:[]).map(Number).filter(n=>n>=0&&n<=6)}:{on:false,wd:[]}}));
  const ids=d.settings.employees.map(e=>e.id);
  if(!ids.includes(Number(d.settings.shiftFirst)))d.settings.shiftFirst=d.settings.employees[0].id;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.settings.shiftStart||''))d.settings.shiftStart=def.settings.shiftStart;
  if(!d.settings.shiftOverrides||typeof d.settings.shiftOverrides!=='object'||Array.isArray(d.settings.shiftOverrides))d.settings.shiftOverrides={};
  else Object.keys(d.settings.shiftOverrides).forEach(k=>{const v=d.settings.shiftOverrides[k];if(v!=='auto'&&!ids.includes(Number(v)))delete d.settings.shiftOverrides[k];});
  d.bookings.forEach(b=>{
    if(!b.employeeId||!ids.includes(b.employeeId)){
      const e=shiftEmpFor(b.date,d.settings);
      b.employeeId=e?e.id:d.settings.employees[0].id;
    }
    if(b.empAuto===undefined)b.empAuto=true;
    if(!b.source)b.source='online';
    if(!Array.isArray(b.notices))b.notices=[];
  });
  if(!d.settings.staffSeen||typeof d.settings.staffSeen!=='object')d.settings.staffSeen={};
  if(!Array.isArray(d.settings.stats))d.settings.stats=defaultDB().settings.stats;
  else d.settings.stats=d.settings.stats.map(x=>({v:String((x&&x.v)||'').slice(0,40),t:String((x&&x.t)||'').slice(0,60)})).filter(x=>x.v);
  return d;
}
let DB;
function loadDB(){
  try{
    const raw=LS.st.getItem(LS_KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d&&d.settings&&Array.isArray(d.services)&&Array.isArray(d.bookings)){
        d.settings=Object.assign(defaultDB().settings,d.settings);
        return normalizeDB(d);
      }
    }
  }catch(e){}
  const d=defaultDB();
  try{LS.st.setItem(LS_KEY,JSON.stringify(d));}catch(e){}
  return d;
}

/* --- режим БД: если рядом запущен сервер (server/server.js) — общий источник данных

     Сервер определяется автоматически при загрузке (GET /api/ping). --- */

const srvFetch=(url,opts)=>fetch(url,Object.assign({},opts,{headers:Object.assign({'Content-Type':'application/json'},(opts&&opts.headers)||{})}));
function mergeState(jdb){
  const base=defaultDB();
  const d=Object.assign({},base,jdb);
  d.settings=Object.assign({},base.settings,(jdb&&jdb.settings)||{});
  DB=normalizeDB(d);
  return DB;
}

    .catch(()=>toast('Сервер БД недоступен — изменения сохранены только локально','err'));

/* --- звук и пуш-уведомления о новых онлайн-записях (админ и сотрудник) --- */
let audioCtx=null;
function unlockAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=audioCtx||new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
document.addEventListener('pointerdown',unlockAudio);
function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    unlockAudio();
    const ctx=audioCtx||new AC();
    const tone=(t0,f)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(f,ctx.currentTime+t0);
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t0);
      g.gain.exponentialRampToValueAtTime(0.3,ctx.currentTime+t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t0+0.24);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+t0);o.stop(ctx.currentTime+t0+0.26);
    };
    tone(0,920);tone(0.26,1240);
  }catch(e){}
}
function ensureNotifPerm(){
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}
}
function pushNotify(title,body){
  beep();
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      const n=new Notification(title,{body:body,tag:'sm'+Date.now()});
      n.onclick=()=>{try{window.focus();n.close();}catch(e){}};
      return;
    }
  }catch(e){}
  toast('🔔 '+title+' — '+body);
}
let seenCodes=null;
function notifWatch(){
  if(seenCodes===null){seenCodes=DB.bookings.map(b=>b.code);return;}
  const fresh=[];
  DB.bookings.forEach(b=>{if(!seenCodes.includes(b.code)){seenCodes.push(b.code);fresh.push(b);}});
  const online=fresh.filter(b=>b.source==='online');
  if(!online.length)return;
  let notified=false;
  if(typeof isStaff==='function'&&isStaff()){
    const mine=online.filter(b=>b.employeeId===S.empId);
    if(mine.length){
      const b0=mine.slice().sort((a,b)=>b.createdAt-a.createdAt)[0];
      pushNotify('Новая запись в вашу смену 🔧',b0.name+' · '+fmtDateShort(b0.date)+' '+b0.time+' · '+fmtMoney(b0.total)+(mine.length>1?' (и ещё '+(mine.length-1)+')':''));
      if(S.filter==='notif'){S.notifIds=S.notifIds||new Set();mine.forEach(x=>S.notifIds.add(x.code));}
      notified=true;
    }
  }else if(typeof isAdmin==='function'&&isAdmin()){
    const b0=online.slice().sort((a,b)=>b.createdAt-a.createdAt)[0];
    pushNotify('Новая онлайн-запись 📝',b0.name+' · '+fmtDateShort(b0.date)+' '+b0.time+' · '+fmtMoney(b0.total)+(online.length>1?' (и ещё '+(online.length-1)+')':''));
    notified=true;
  }
  if(notified&&typeof renderAdmin==='function'&&typeof renderStaff==='function'&&!document.querySelector('.modal-box')){
    if(typeof isStaff==='function'&&isStaff())renderStaff();
    else if(typeof isAdmin==='function'&&isAdmin())renderAdmin();
  }
}

/* --- автоматические уведомления клиенту: SMS или MAX, без выбора --- */
function clientChannel(){return DB.settings.smsChannel==='max'?'MAX':'SMS';}
function notifyClient(b,kind){
  if(!b||!b.phone)return null;
  if(!Array.isArray(b.notices))b.notices=[];
  const ch=clientChannel();
  const text=kind==='cancelled'
    ?DB.settings.companyName+': запись '+b.code+' на '+fmtDateShort(b.date)+' '+b.time+' отменена. Записаться заново можно на сайте или по телефону '+DB.settings.phone
    :clientMsg(b);
  const notice={when:Date.now(),channel:ch,kind:kind||'',text:text,delivered:false};
  const url=(DB.settings.smsWebhook||'').trim();
  if(url){
    notice.delivered=null;
    try{
      fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel:ch.toLowerCase(),phone:b.phone,text:text,code:b.code,kind:kind||''})})
        .then(r=>{notice.delivered=r.ok;save();})
        .catch(()=>{notice.delivered=false;save();});
    }catch(e){notice.delivered=false;}
  }
  b.notices.push(notice);
  save();
  return notice;
}
function noticeLine(b){
  if(!Array.isArray(b.notices)||!b.notices.length)return '';
  const n=b.notices[b.notices.length-1];
  const mark=n.delivered===true?'✓ доставлено':(n.delivered===null?'⏳ отправляется через шлюз':'— шлюз не настроен, текст сохранён');
  return '<div class="sv">📨 '+n.channel+' клиенту · '+fmtDT(n.when)+' '+mark+'</div>';
}
function weekRange(){const n=new Date();const dow=(n.getDay()+6)%7;const mon=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow);return{from:isoOf(mon),to:todayISO()};}
function monthRange(){const t=todayISO();return{from:t.slice(0,8)+'01',to:t};}
/* свободные слоты при редактировании (исключая саму запись) */
function freeTimesFor(dateISO,needDur,excludeCode){
  const s=DB.settings;
  if(isClosed(dateISO))return [];
  const end=toMin(s.workEnd);const dur=Math.max(30,needDur||60);
  const now=new Date();const isToday=dateISO===todayISO();
  const cutoff=isToday?now.getHours()*60+now.getMinutes()+15:-1;
  const out=[];
  for(let m=toMin(s.workStart);m<end;m+=s.interval){
    const t=toHHMM(m);
    const used=liveBookings().filter(x=>x.date===dateISO&&x.time===t&&x.code!==excludeCode).length;
    if((m>cutoff)&&(s.posts-used>0)&&(m+dur<=end))out.push(t);
  }
  return out;
}
const liveBookings=()=>DB.bookings.filter(b=>b.status!=='cancelled');
const activeAt=(date,time)=>liveBookings().filter(b=>b.date===date&&b.time===time).length;
function isClosed(dateISO){
  const s=DB.settings;
  const dow=new Date(dateISO+'T00:00:00').getDay();
  if(!s.workDays.includes(dow))return true;
  return (s.blockedDates||[]).includes(dateISO);
}
function daySlots(dateISO,needDur,excludeCode){
  const s=DB.settings;
  if(isClosed(dateISO))return [];
  const out=[];const end=toMin(s.workEnd);
  const now=new Date();const isToday=dateISO===todayISO();
  const cutoff=isToday?now.getHours()*60+now.getMinutes()+15:-1;
  const dur=Math.max(30,needDur||60);
  for(let m=toMin(s.workStart);m<end;m+=s.interval){
    const t=toHHMM(m);
    const used=liveBookings().filter(x=>x.date===dateISO&&x.time===t&&x.code!==excludeCode).length;
    const free=s.posts-used;
    const blocked=(m<=cutoff)||(free<=0)||(m+dur>end);
    out.push({t,free,blocked});
  }
  return out;
}
function slotAvailable(dateISO,time,needDur,excludeCode){
  const s=DB.settings;
  if(isClosed(dateISO))return false;
  const m=toMin(time);const end=toMin(s.workEnd);
  const dur=Math.max(30,needDur||60);
  if(m<toMin(s.workStart)||m+dur>end)return false;
  const now=new Date();
  if(dateISO===todayISO()&&m<=now.getHours()*60+now.getMinutes()+15)return false;
  const used=liveBookings().filter(b=>b.date===dateISO&&b.time===time&&b.code!==excludeCode).length;
  return used<s.posts;
}

const escIcs=v=>String(v).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;');
function downloadIcs(b){
  const dur=Math.max(30,b.services.reduce((a,x)=>{const s=svcById(x.id);return a+(s?s.dur:30);},0));
  const endM=Math.min(toMin(b.time)+dur,23*60+59);
  const day=b.date.replace(/-/g,'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ShinaService//RU','BEGIN:VEVENT',
    'UID:'+b.code+'@shinaservice',
    'DTSTART:'+day+'T'+b.time.replace(':','')+'00',
    'DTEND:'+day+'T'+toHHMM(endM).replace(':','')+'00',
    'SUMMARY:'+escIcs(DB.settings.companyName+' — шиномонтаж'),
    'DESCRIPTION:'+escIcs(b.services.map(x=>x.name).join(', ')+' · '+fmtMoney(b.total)+' · код '+b.code),
    'LOCATION:'+escIcs(DB.settings.address),
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.code+'.ics';
  document.body.appendChild(a);a.click();a.remove();

}
function hoursText(){
  const s=DB.settings;const d=Array.from(new Set(s.workDays)).sort((a,b)=>a-b);
  if(d.length===7)return 'Ежедневно '+s.workStart+'–'+s.workEnd;
  if(!d.length)return 'График уточняйте по телефону';
  const n=WD;let parts=[];let start=d[0],prev=d[0];
  for(let i=1;i<=d.length;i++){
    if(d[i]===prev+1){prev=d[i];continue;}
    parts.push(start===prev?n[start]:n[start]+'–'+n[prev]);
    start=d[i];prev=d[i];
  }
  return parts.join(', ')+': '+s.workStart+'–'+s.workEnd;
}

function phoneMask(inp){
  let d=(inp.value||'').replace(/\D/g,'');
  if(d&&d[0]==='8')d='7'+d.slice(1);
  if(d&&d[0]!=='7')d='7'+d;
  d=d.slice(0,11);
  let out='';
  if(d.length){out='+7';
    if(d.length>1)out+=' ('+d.slice(1,4);
    if(d.length>=5)out+=') '+d.slice(4,7);
    if(d.length>=8)out+='-'+d.slice(7,9);
    if(d.length>=10)out+='-'+d.slice(9,11);
  }
  inp.value=out;
}

}
function cabItems(){
  if(SRV.mode&&!SRV.authed)return SRV.cab.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  return DB.bookings.filter(b=>normDigits(b.phone)===CAB.phone)
    .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
}
function isFutureBooking(b){
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  return b.date>todayISO()||(b.date===todayISO()&&toMin(b.time)>nowM);
}
function renderCabinet(){
  const wrap=$('#myList');
  const items=cabItems();
  if(!items.length){
    CAB.phone='';
    wrap.innerHTML='<div class="msg" style="max-width:720px">По этому телефону записей не найдено. Проверьте номер или создайте новую запись выше.</div>';
    return;
  }
  const t=todayISO();
  const done=items.filter(b=>b.status==='done');
  const spend=done.reduce((a,b)=>a+(b.total||0),0);
  const exp=items.filter(b=>b.status==='confirmed'&&b.date>=t).reduce((a,b)=>a+(b.total||0),0);
  const avg=done.length?Math.round(spend/done.length):0;
  const upcoming=items.filter(b=>(b.status==='new'||b.status==='confirmed')&&isFutureBooking(b)).length;
  const svc={};
  items.filter(b=>b.status!=='cancelled').forEach(b=>(b.services||[]).forEach(s=>{
    const m=svc[s.id]||(svc[s.id]={name:s.name,cnt:0,sum:0});
    m.cnt++;m.sum+=s.price||0;
  }));
  const svcRows=Object.values(svc).sort((a,b)=>b.sum-a.sum).map(m=>
    '<div class="cab-svc-row"><b>'+esc(m.name)+'</b><span class="sub">× '+m.cnt+'</span>'+
    '<b style="flex:none;min-width:84px;text-align:right">'+fmtMoney(m.sum)+'</b></div>').join('');
  wrap.innerHTML=
    '<div class="st-stats cab-stats">'+
      '<div class="st-stat"><span>Визитов выполнено</span><b>'+done.length+'</b><i>за всё время</i></div>'+
      '<div class="st-stat"><span>Потрачено всего</span><b style="color:var(--ok)">'+fmtMoney(spend)+'</b><i>по выполненным</i></div>'+
      '<div class="st-stat"><span>Ожидается к оплате</span><b>'+fmtMoney(exp)+'</b><i>утверждённые визиты</i></div>'+
      '<div class="st-stat"><span>Средний чек</span><b>'+fmtMoney(avg)+'</b><i>за визит · впереди записей: '+upcoming+'</i></div>'+
    '</div>'+
    (Object.keys(svc).length?'<div class="cab-box"><h3 style="margin-bottom:2px">Мои услуги</h3><p class="mut-sm" style="margin-bottom:6px">Сколько раз заказывали и на какую сумму — без отменённых.</p>'+svcRows+'</div>':'')+
    '<h3 style="margin:14px 0 10px">История записей <span class="sub">— нажмите на запись, чтобы открыть подробности</span></h3>'+
    items.map(b=>{
      const future=isFutureBooking(b);
      const canCancel=(b.status==='new'||b.status==='confirmed')&&future;
      const editable=b.status==='new'&&future;
      return '<div class="my-item clickable'+(b.status==='cancelled'?' cancelled':'')+'" data-myopen="'+b.code+'" title="Открыть подробности">'+
        '<div class="l"><b>'+fmtDateShort(b.date)+' ('+weekdayRu(b.date)+') в '+b.time+' · '+b.code+'</b>'+
        '<span>'+esc(b.services.map(s=>s.name).join(' + '))+' · '+fmtMoney(b.total)+'</span>'+
        (editable?'<span style="color:var(--acc2)">✎ Можно изменить, пока администратор не подтвердил</span>':'')+
        (Array.isArray(b.notices)&&b.notices.length?'<span style="color:var(--acc2)">📨 Подтверждение отправлено по '+clientChannel()+'</span>':'')+'</div>'+
        '<div style="display:flex;gap:8px;align-items:center">'+stBadge(b.status)+
        (canCancel?'<button class="btn btn-d btn-s" data-cancel="'+b.code+'">Отменить</button>':'')+
        '</div></div>';
    }).join('')+
    '<button class="btn btn-o btn-s" data-cabout style="margin-top:6px">Выйти из кабинета</button>';
}
function openMyDetails(code){
  const src=(SRV.mode&&!SRV.authed)?SRV.cab:DB.bookings;
  const b=src.find(x=>x.code===code);if(!b)return;
  const future=isFutureBooking(b);
  const canCancel=(b.status==='new'||b.status==='confirmed')&&future;
  const canEdit=b.status==='new'&&future;
  const emp=empById(b.employeeId);
  const notices=(b.notices||[]).slice().sort((a,b2)=>(b2.when||0)-(a.when||0)).map(n=>
    '<div style="margin-bottom:4px">📨 '+esc(n.text||'')+(n.when?' <span class="sub">· '+fmtDT(n.when)+'</span>':'')+'</div>').join('')||'—';
  openModal(
    '<div class="m-head"><h3>Запись '+b.code+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body"><div class="cab-dtl">'+
      '<div class="cab-dtl-row"><span>Статус</span><div style="flex:1;min-width:0">'+stBadge(b.status)+(b.source==='phone'?' <span class="st st-src-ph">создана администратором</span>':' <span class="st st-src-on">онлайн</span>')+'</div></div>'+
      '<div class="cab-dtl-row"><span>Дата и время</span><div style="flex:1;min-width:0"><b>'+fmtDateHuman(b.date)+', '+b.time+'</b>'+(future?'':' <span class="sub">— визит в прошлом</span>')+'</div></div>'+
      '<div class="cab-dtl-row"><span>Мастер</span><div style="flex:1;min-width:0">'+(emp?esc(emp.name):'—')+' <span class="sub">· закрепляется по графику смен</span></div></div>'+
      '<div class="cab-dtl-row"><span>Авто</span><div style="flex:1;min-width:0">'+esc(b.car||'—')+(b.plate?' · '+esc(b.plate):'')+'</div></div>'+
      '<div class="cab-dtl-row"><span>Услуги</span><div style="flex:1;min-width:0">'+b.services.map(s=>'<div>'+esc(s.name)+' — <b>'+fmtMoney(s.price)+'</b></div>').join('')+'</div></div>'+
      '<div class="cab-dtl-row"><span>Итого</span><div style="flex:1;min-width:0"><b style="color:var(--acc2);font-size:16px">'+fmtMoney(b.total)+'</b></div></div>'+
      (b.comment?'<div class="cab-dtl-row"><span>Комментарий</span><div style="flex:1;min-width:0">'+esc(b.comment)+'</div></div>':'')+
      '<div class="cab-dtl-row"><span>Создана</span><div style="flex:1;min-width:0">'+fmtDT(b.createdAt)+'</div></div>'+
      '<div class="cab-dtl-row"><span>Уведомления</span><div style="flex:1;min-width:0;font-size:13px">'+notices+'</div></div>'+
    '</div>'+
    (canEdit?'<p class="mut-sm" style="margin-top:10px">Запись ещё не подтверждена администратором — вы можете изменить дату, время, услуги и данные авто.</p>':'')+
    '</div>'+
    '<div class="m-foot">'+
      (canEdit?'<button class="btn btn-o" id="myEdit">✎ Изменить</button>':'')+
      (canCancel?'<button class="btn btn-d" id="myCancel">✗ Отменить запись</button>':'')+
      '<button class="btn btn-p" data-mx>Закрыть</button></div>');
  const ed=$('#myEdit');
  if(ed)ed.onclick=()=>openMyEdit(b);
  const cn=$('#myCancel');
  if(cn)cn.onclick=()=>openConfirm('Отменить запись?','Запись <b>'+b.code+'</b> на '+esc(fmtDateHuman(b.date))+', '+b.time+' будет отменена.','Да, отменить',()=>{
    b.status='cancelled';
    cabNotice(b,'Запись отменена клиентом через личный кабинет');
    if(SRV.mode&&!SRV.authed)srvPushBookingPatch(b);
    save();closeModal();renderCabinet();
    toast('Запись '+b.code+' отменена');
  });
}
function openMyEdit(b){
  const act=activeServices();
  const extra=b.services.filter(s=>!act.some(x=>x.id===s.id)).map(s=>Object.assign({},s,{hidden:true}));
  const all=act.concat(extra);
  const has=id=>b.services.some(x=>x.id===id);
  openModal(
    '<div class="m-head"><h3>Изменить запись '+b.code+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body">'+
      '<div class="f-grid">'+
        '<div><label class="lb req">Дата</label><input type="date" id="ceDate" class="inp" min="'+todayISO()+'" value="'+(b.date>=todayISO()?b.date:todayISO())+'"></div>'+
        '<div><label class="lb req">Время</label><select id="ceTime" class="inp"><option value="">— выберите дату —</option></select></div>'+
        '<div><label class="lb req">Имя</label><input id="ceName" class="inp" value="'+esc(b.name)+'"></div>'+
        '<div><label class="lb">Авто</label><input id="ceCar" class="inp" value="'+esc(b.car||'')+'"></div>'+
        '<div><label class="lb">Госномер</label><input id="cePlate" class="inp" value="'+esc(b.plate||'')+'"></div>'+
        '<div class="full"><label class="lb">Комментарий</label><input id="ceCom" class="inp" value="'+esc(b.comment||'')+'" placeholder="Например: шины лежат в багажнике"></div>'+
      '</div>'+
      '<label class="lb" style="margin-top:10px">Услуги</label>'+
      all.map(s=>'<label class="svc-row'+(has(s.id)?' on':'')+'"><input type="checkbox" data-cesvc="'+s.id+'"'+(has(s.id)?' checked':'')+'><span class="cb">✓</span>'+
        '<span class="n"><b>'+esc(s.name)+'</b><span>≈ '+s.dur+' мин'+(s.hidden?' · услуга скрыта для новых записей':'')+'</span></span>'+
        '<span class="p">'+(s.price===0?'0 ₽':fmtMoney(s.price))+'</span></label>').join('')+
      '<div class="tot"><span class="t2">Итого</span><span id="ceTotal">'+fmtMoney(b.total)+'</span></div>'+
      '<p class="mut-sm" style="margin-top:8px">Мастер закрепляется по графику смен автоматически. После сохранения администратор увидит изменения в своей панели.</p>'+
      '<div class="msg warn" id="ceMsg" style="display:none;margin-top:10px"></div>'+
    '</div>'+
    '<div class="m-foot"><button class="btn btn-o" data-mx>Отмена</button><button class="btn btn-p" id="ceSave">Сохранить</button></div>');
  const picks=()=>Array.from($('#modalBox').querySelectorAll('[data-cesvc]:checked')).map(i=>svcById(i.dataset.cesvc)).filter(Boolean);
  const ceDur=()=>Math.max(30,picks().reduce((a,s)=>a+s.dur,0));
  const updTot=()=>{$('#ceTotal').textContent=fmtMoney(picks().reduce((a,s)=>a+s.price,0));};
  const loadSlots=()=>{
    const sel=$('#ceTime');const d=$('#ceDate').value;
    if(!d){sel.innerHTML='<option value="">— выберите дату —</option>';return;}
    const slots=daySlots(d,ceDur(),b.code).filter(s=>!s.blocked);
    sel.innerHTML=slots.length?slots.map(s=>'<option value="'+s.t+'">'+s.t+'</option>').join(''):'<option value="">нет свободных слотов</option>';
  };
  $('#modalBox').querySelectorAll('[data-cesvc]').forEach(ch=>ch.addEventListener('change',()=>{
    ch.closest('.svc-row').classList.toggle('on',ch.checked);
    updTot();loadSlots();
  }));
  $('#ceDate').addEventListener('change',loadSlots);
  $('#ceSave').onclick=()=>{
    const name=$('#ceName').value.trim();
    const date=$('#ceDate').value;const time=$('#ceTime').value;
    const list=picks();
    const msg=$('#ceMsg');msg.style.display='none';
    const err=t=>{msg.textContent=t;msg.style.display='block';};
    if(name.length<2)return err('Укажите имя');
    if(!date)return err('Выберите дату');
    if(!time)return err('Выберите время');
    if(!list.length)return err('Выберите хотя бы одну услугу');
    if(!slotAvailable(date,time,ceDur(),b.code))return err('Это время уже занято — выберите другое');
    const changes=[];
    if(b.date!==date||b.time!==time)changes.push('время: '+fmtDateShort(b.date)+' '+b.time+' → '+fmtDateShort(date)+' '+time);
    if(b.services.map(s=>s.name).join(',')!==list.map(s=>s.name).join(','))changes.push('услуги: '+list.map(s=>s.name).join(' + '));
    b.date=date;b.time=time;b.name=name;
    b.car=$('#ceCar').value.trim();b.plate=$('#cePlate').value.trim().toUpperCase();b.comment=$('#ceCom').value.trim();
    b.services=list.map(s=>({id:s.id,name:s.name,price:s.price}));
    b.total=list.reduce((a,s)=>a+s.price,0);
    if(b.empAuto){const e=empOn(date);if(e)b.employeeId=e.id;}
    if(changes.length)cabNotice(b,'Изменено клиентом через личный кабинет ('+changes.join('; ')+')');
    if(SRV.mode&&!SRV.authed)srvPushBookingPatch(b);
    save();closeModal();renderCabinet();
    toast('Запись '+b.code+' обновлена — администратор увидит изменения');
  };
}
$('#myPhone').addEventListener('input',e=>phoneMask(e.target));
$('#myPhone').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();findMy();}});
$('#myFind').addEventListener('click',findMy);
$('#myList').addEventListener('click',e=>{
  const btn=e.target.closest('[data-cancel]');
  if(btn){
    const b=DB.bookings.find(x=>x.code===btn.dataset.cancel);if(!b)return;
    openConfirm('Отменить запись?','Запись <b>'+b.code+'</b> на '+esc(fmtDateHuman(b.date))+', '+b.time+' будет отменена.','Да, отменить',()=>{
      b.status='cancelled';
      cabNotice(b,'Запись отменена клиентом через личный кабинет');
      if(SRV.mode&&!SRV.authed)srvPushBookingPatch(b);
      save();renderCabinet();toast('Запись '+b.code+' отменена');
    });
    return;
  }
  if(e.target.closest('[data-cabout]')){
    CAB.phone='';$('#myPhone').value='';$('#myList').innerHTML='';
    return;
  }
  const card=e.target.closest('[data-myopen]');
  if(card)openMyDetails(card.dataset.myopen);
});
/* делегирование: выбрать услугу из сетки */
$('#svcGrid').addEventListener('click',e=>{
  const btn=e.target.closest('[data-choose]');if(!btn)return;
  chooseService(btn.dataset.choose);
});
</script>
