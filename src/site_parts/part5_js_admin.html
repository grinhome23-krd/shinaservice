<script>
'use strict';
/* ================= АДМИНКА ================= */
const A={tab:'dash',f:{status:'all',range:'all',q:'',emp:'all'}};
const isAdmin=()=>SS.st.getItem('sm_admin')==='1';
function renderAdmin(){
  $$('#aTabs .a-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===A.tab));
  ['dash','bookings','services','schedule','settings'].forEach(t=>{$('#a-'+t).hidden=t!==A.tab;});
  if(A.tab==='dash')renderDash();
  if(A.tab==='bookings')renderBookings();
  if(A.tab==='services')renderServicesAdmin();
  if(A.tab==='schedule')renderSchedule();
  if(A.tab==='settings')renderSettings();
}
$('#aTabs').addEventListener('click',e=>{
  const b=e.target.closest('.a-tab');if(!b)return;
  A.tab=b.dataset.tab;renderAdmin();
});

/* --- панель --- */
function renderDash(){
  const t=todayISO();
  const live=liveBookings();
  const today=live.filter(b=>b.date===t).sort((a,b)=>a.time.localeCompare(b.time));
  const news=DB.bookings.filter(b=>b.status==='new').sort((a,b)=>b.createdAt-a.createdAt);
  const week=live.filter(b=>b.date>=t&&b.date<=addDaysISO(t,7));
  const mp=t.slice(0,7);
  const rev=live.filter(b=>liveDone(b)&&b.date.slice(0,7)===mp).reduce((a,b)=>a+(b.total||0),0);
  $('#statToday').textContent=today.length;
  $('#statNew').textContent=news.length;
  $('#statWeek').textContent=week.length;
  $('#statRev').textContent=fmtMoney(rev);
  const days=[];let max=1;
  for(let i=6;i>=0;i--){const d=addDaysISO(t,-i);const c=live.filter(b=>b.date===d).length;max=Math.max(max,c);days.push({d,c});}
  $('#chart').innerHTML=days.map(x=>
    '<button type="button" class="cbar'+(x.d===t?' today':'')+'" data-day="'+x.d+'" title="Записи за '+fmtDateShort(x.d)+' — нажмите"><div class="cv">'+(x.c||'')+'</div>'+
    '<div class="bar" style="height:'+Math.round(x.c/max*100)+'%"></div>'+
    '<div class="cl">'+weekdayRu(x.d)+' '+fmtDateShort(x.d).slice(0,5)+'</div></button>').join('');
  $('#todayList').innerHTML=today.length?today.map(b=>
    '<div class="trow"><b style="min-width:50px">'+b.time+'</b>'+
    '<div style="flex:1;min-width:0"><div>'+esc(b.name)+(b.car?' <span class="sub">· '+esc(b.car)+'</span>':'')+'</div>'+
    '<div class="sub">'+esc(b.services.map(s=>s.name).join(' + '))+'</div></div>'+
    stBadge(b.status)+'</div>').join(''):'<div class="empty">На сегодня записей нет</div>';
  $('#newList').innerHTML=news.length?news.slice(0,6).map(b=>
    '<div class="trow"><div style="flex:1;min-width:0"><div>'+esc(b.name)+' · '+fmtDateShort(b.date)+' '+b.time+' <span class="sub">· '+b.code+'</span></div>'+
    '<div class="sub">'+esc(b.services.map(s=>s.name).join(' + '))+' · '+fmtMoney(b.total)+'</div></div>'+
    '<div style="display:flex;gap:6px"><button class="btn btn-ok btn-s" data-ok="'+b.code+'">✓ Подтвердить</button>'+
    '<button class="btn btn-d btn-s" data-no="'+b.code+'" title="Отменить">✗</button></div></div>').join('')
    :'<div class="empty">Новых записей нет</div>';
  const tm=addDaysISO(t,1);
  const eToday=empOn(t),eTm=empOn(tm);
  const shRow=(d,e)=>'<div class="trow"><div style="flex:1"><div>'+fmtDateHuman(d)+'</div><div class="sub">смена мастера</div></div>'+
    (e?empBadge(e.id):'<span class="st st-cancel">нет активных мастеров</span>')+'</div>';
  const flexOn=DB.settings.employees.some(e=>e.active&&e.flex&&e.flex.on&&Array.isArray(e.flex.wd)&&e.flex.wd.length);
  $('#shiftInfo').innerHTML=shRow(t,eToday)+shRow(tm,eTm)+
    '<p class="mut-sm" style="margin-top:10px">'+(flexOn?'Включён гибкий график: в выбранные сотрудником дни смена закреплена за ним, в остальные — общее чередование.':'Мастера чередуются через день.')+' Подробнее: Настройки → «Сотрудники и смены». Записи автоматически закрепляются за мастером по дате визита.</p>';
  const rows=empRevenueRows();
  const tot=rows.reduce((a,r)=>({mRev:a.mRev+r.mRev,mCnt:a.mCnt+r.mCnt,allRev:a.allRev+r.allRev,allCnt:a.allCnt+r.allCnt,expRev:a.expRev+r.expRev,expCnt:a.expCnt+r.expCnt}),
    {mRev:0,mCnt:0,allRev:0,allCnt:0,expRev:0,expCnt:0});
  const nums=r=>'<div class="nums">'+
    '<span><span class="lbl">Факт за месяц (выполнено)</span><b>'+fmtMoney(r.mRev)+'</b> · '+r.mCnt+' заказ.</span>'+
    '<span><span class="lbl">Факт всего</span><b>'+fmtMoney(r.allRev)+'</b> · '+r.allCnt+' заказ.</span>'+
    '<span><span class="lbl">Ожидается (утверждено)</span><b style="color:var(--acc2)">'+fmtMoney(r.expRev)+'</b> · '+r.expCnt+' запис.</span></div>';
  $('#empRevList').innerHTML='<div class="rev-row total"><span class="tot-chip">Итого · все мастера</span>'+nums(tot)+'</div>'+
    rows.map(r=>'<div class="rev-row">'+empBadge(r.e.id)+nums(r)+'</div>').join('')||'<div class="empty">Сотрудников нет</div>';
}
function empRevenueRows(){
  const t=todayISO(),mr=monthRange();
  return DB.settings.employees.map(e=>{
    const mine=DB.bookings.filter(b=>b.employeeId===e.id);
    const done=mine.filter(b=>b.status==='done');
    const mDone=done.filter(b=>b.date>=mr.from&&b.date<=mr.to);
    const exp=mine.filter(b=>b.status==='confirmed'&&b.date>=t);
    return {e,mRev:mDone.reduce((a,b)=>a+(b.total||0),0),mCnt:mDone.length,
      allRev:done.reduce((a,b)=>a+(b.total||0),0),allCnt:done.length,
      expRev:exp.reduce((a,b)=>a+(b.total||0),0),expCnt:exp.length};
  });
}
$('#newList').addEventListener('click',e=>{
  const ok=e.target.closest('[data-ok]');const no=e.target.closest('[data-no]');
  const b=DB.bookings.find(x=>x.code===((ok&&ok.dataset.ok)||(no&&no.dataset.no)));
  if(!b)return;
  if(ok){b.status='confirmed';notifyClient(b,'confirmed');save();renderDash();toast('Запись '+b.code+' подтверждена · клиенту отправлено '+clientChannel());}
  if(no){openConfirm('Отменить запись?','Запись <b>'+b.code+'</b> будет отменена, клиент получит уведомление.','Отменить',()=>{b.status='cancelled';notifyClient(b,'cancelled');save();renderDash();toast('Запись отменена · клиент уведомлён');});}
});
/* --- клик по столбцу загрузки: день со всеми записями --- */
function dayRowsHtml(iso){
  const items=DB.bookings.filter(b=>b.date===iso).sort((a,b)=>a.time.localeCompare(b.time));
  return items.length?items.map(b=>
    '<div class="trow" data-bk="'+b.code+'" style="cursor:pointer" title="Открыть запись"><b style="min-width:50px">'+b.time+'</b>'+
    '<div style="flex:1;min-width:0"><div>'+esc(b.name)+(b.car?' <span class="sub">· '+esc(b.car)+'</span>':'')+' <span class="sub">· '+b.code+'</span></div>'+
    '<div class="sub">'+esc(b.services.map(s=>s.name).join(' + '))+' · '+fmtMoney(b.total)+'</div></div>'+
    stBadge(b.status)+(b.employeeId&&empById(b.employeeId)?empBadge(b.employeeId):'')+'</div>').join('')
  :'<div class="empty">Записей на этот день нет</div>';
}
function openDayReport(iso){
  const items=DB.bookings.filter(b=>b.date===iso);
  const cnt=st=>items.filter(b=>b.status===st).length;
  const done=items.filter(b=>b.status==='done').reduce((a,b)=>a+(b.total||0),0);
  const exp=items.filter(b=>b.status==='confirmed').reduce((a,b)=>a+(b.total||0),0);
  openModal(
    '<div class="m-head"><h3>Записи за '+fmtDateHuman(iso)+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body">'+
      '<div class="st-stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">'+
        '<div class="st-stat"><span>Всего записей</span><b>'+items.length+'</b><i>новых: '+cnt('new')+' · подтверждено: '+cnt('confirmed')+'</i></div>'+
        '<div class="st-stat"><span>Выполнено</span><b style="color:var(--ok)">'+cnt('done')+'</b><i>'+fmtMoney(done)+'</i></div>'+
        '<div class="st-stat"><span>Отменено</span><b>'+cnt('cancelled')+'</b><i>ожидается '+fmtMoney(exp)+'</i></div>'+
      '</div>'+
      dayRowsHtml(iso)+
      '<p class="mut-sm" style="margin-top:10px">Нажмите на запись — подробности: клиент, авто, услуги, статус, журнал уведомлений, редактирование.</p>'+
    '</div>');
}
$('#chart').addEventListener('click',e=>{
  const b=e.target.closest('[data-day]');if(!b)return;
  openDayReport(b.dataset.day);
});
$('#modalBox').addEventListener('click',e=>{
  const r=e.target.closest('[data-bk]');if(!r)return;
  openBookingDetails(r.dataset.bk);
});

/* --- записи --- */
function filteredBookings(){
  const f=A.f;const t=todayISO();const tm=addDaysISO(t,1);
  return DB.bookings.filter(b=>{
    if(f.status!=='all'&&b.status!==f.status)return false;
    if(f.emp!=='all'&&String(b.employeeId)!==f.emp)return false;
    if(f.range==='today'&&b.date!==t)return false;
    if(f.range==='tomorrow'&&b.date!==tm)return false;
    if(f.range==='week'&&!(b.date>=t&&b.date<=addDaysISO(t,7)))return false;
    if(f.range==='future'&&b.date<t)return false;
    if(f.range==='past'&&b.date>=t)return false;
    const q=f.q.trim().toLowerCase();
    if(q&&!(b.name+' '+b.phone+' '+b.code+' '+(b.car||'')+' '+(b.plate||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
}
function renderEmpFilter(){
  const sel=$('#fEmp');const cur=A.f.emp;
  sel.innerHTML='<option value="all">Все мастера</option>'+
    DB.settings.employees.filter(e=>e.active).map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join('')+
    (cur!=='all'&&!empById(cur)?'<option value="'+cur+'">удалён</option>':'');
  sel.value=cur;
}
function renderBookings(){
  renderEmpFilter();
  const list=filteredBookings();
  $('#bkCount').textContent='Найдено записей: '+list.length;
  $('#bkBody').innerHTML=list.length?list.map(b=>
    '<tr><td><b>'+b.code+'</b><div class="sub">'+fmtDT(b.createdAt)+'</div><div class="sub" style="margin-top:3px">'+srcBadge(b.source)+'</div></td>'+
    '<td style="white-space:nowrap">'+fmtDateShort(b.date)+'<div class="sub">'+weekdayRu(b.date)+', '+b.time+'</div></td>'+
    '<td>'+esc(b.name)+'<div class="sub"><a href="tel:'+b.phone.replace(/[^+\d]/g,'')+'">'+esc(b.phone)+'</a></div></td>'+
    '<td class="hide-m">'+esc(b.car||'—')+(b.plate?'<div class="sub">'+esc(b.plate)+'</div>':'')+'</td>'+
    '<td class="hide-m">'+esc(b.services.map(s=>s.name).join(', '))+'</td>'+
    '<td class="hide-m">'+empBadge(b.employeeId)+'</td>'+
    '<td style="white-space:nowrap">'+fmtMoney(b.total)+'</td>'+
    '<td><select class="inp inp-sm" data-st="'+b.code+'">'+
      ['new','confirmed','done','cancelled'].map(x=>'<option value="'+x+'"'+(b.status===x?' selected':'')+'>'+ST[x].t+'</option>').join('')+
    '</select></td>'+
    '<td style="white-space:nowrap"><button class="btn btn-o btn-s" data-edit="'+b.code+'" title="Изменить">✎</button> <button class="btn btn-o btn-s" data-view="'+b.code+'" title="Подробнее">👁</button> <button class="btn btn-d btn-s" data-del="'+b.code+'" title="Удалить">🗑</button></td></tr>').join('')
    :'<tr><td colspan="9" class="empty">Записей не найдено</td></tr>';
}
$('#fStatus').addEventListener('change',e=>{A.f.status=e.target.value;renderBookings();});
$('#fRange').addEventListener('change',e=>{A.f.range=e.target.value;renderBookings();});
$('#fEmp').addEventListener('change',e=>{A.f.emp=e.target.value;renderBookings();});
$('#fQ').addEventListener('input',e=>{A.f.q=e.target.value;renderBookings();});
$('#bkBody').addEventListener('change',e=>{
  const sel=e.target.closest('[data-st]');if(!sel)return;
  const b=DB.bookings.find(x=>x.code===sel.dataset.st);if(!b)return;
  const was=b.status;b.status=sel.value;
  if(b.status!==was&&(b.status==='confirmed'||b.status==='cancelled'))notifyClient(b,b.status);
  save();
  toast('Статус '+b.code+': '+ST[b.status].t+((b.status==='confirmed'||b.status==='cancelled')&&b.status!==was?' · клиент уведомлён ('+clientChannel()+')':''));
});
$('#bkBody').addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');const d=e.target.closest('[data-del]');const ed=e.target.closest('[data-edit]');
  if(ed)openBookingEdit(ed.dataset.edit,{staff:false});
  if(v)openBookingDetails(v.dataset.view);
  if(d){
    const b=DB.bookings.find(x=>x.code===d.dataset.del);if(!b)return;
    openConfirm('Удалить запись?','Запись <b>'+b.code+'</b> ('+esc(b.name)+') будет удалена безвозвратно.','Удалить',()=>{
      DB.bookings=DB.bookings.filter(x=>x.code!==b.code);save();renderBookings();toast('Запись удалена');
    });
  }
});
function openBookingDetails(code){
  const b=DB.bookings.find(x=>x.code===code);if(!b)return;
  openModal(
    '<div class="m-head"><h3>Запись '+b.code+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body">'+
      '<div class="sumbox">'+
        '<div class="row"><span>Статус</span><b>'+stBadge(b.status)+'</b></div>'+
        '<div class="row"><span>Дата и время</span><b>'+fmtDateHuman(b.date)+', '+b.time+'</b></div>'+
        '<div class="row"><span>Клиент</span><b>'+esc(b.name)+'</b></div>'+
        '<div class="row"><span>Телефон</span><b><a href="tel:'+b.phone.replace(/[^+\d]/g,'')+'">'+esc(b.phone)+'</a></b></div>'+
        '<div class="row"><span>Авто</span><b>'+esc([b.car,b.plate].filter(Boolean).join(', ')||'—')+'</b></div>'+
        '<div class="row"><span>Услуги</span><b>'+esc(b.services.map(s=>s.name).join(' + '))+'</b></div>'+
        '<div class="row"><span>Мастер</span><b>'+(b.employeeId&&empById(b.employeeId)?empBadge(b.employeeId):'—')+'</b></div>'+
        '<div class="row"><span>Сумма</span><b>'+fmtMoney(b.total)+'</b></div>'+
        (b.comment?'<div class="row"><span>Комментарий</span><b>'+esc(b.comment)+'</b></div>':'')+
        '<div class="row"><span>Источник</span><b>'+srcBadge(b.source)+'</b></div>'+
        '<div class="row"><span>Создана</span><b>'+fmtDT(b.createdAt)+'</b></div>'+
      '</div>'+
      '<div class="msg" style="margin-top:10px"><b>📨 Уведомления клиенту</b>'+
        (Array.isArray(b.notices)&&b.notices.length
          ?b.notices.map(n=>'<div style="margin-top:6px;font-size:13px">'+n.channel+' · '+fmtDT(n.when)+' · '+(n.delivered===true?'✓ доставлено':(n.delivered===null?'⏳ отправляется через шлюз':'⚠ шлюз не настроен — текст сохранён'))+': '+esc(n.text)+'</div>').join('')
          :'<div style="margin-top:6px">пока не отправлялись</div>')+
      '</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+
        '<button class="btn btn-o btn-s" id="bdEdit">✎ Изменить запись</button>'+
        ['new','confirmed','done','cancelled'].map(x=>'<button class="btn '+(b.status===x?'btn-p':'btn-o')+' btn-s" data-setst="'+x+'">'+ST[x].t+'</button>').join('')+
      '</div>'+
    '</div>');
  $('#bdEdit').onclick=()=>openBookingEdit(b.code,{staff:false});
  $$('#modalBox [data-setst]').forEach(btn=>btn.onclick=()=>{
    const was=b.status;b.status=btn.dataset.setst;
    if(b.status!==was&&(b.status==='confirmed'||b.status==='cancelled'))notifyClient(b,b.status);
    save();closeModal();renderAdmin();toast('Статус изменён: '+ST[b.status].t);
  });
}
/* --- редактирование записи (админ и сотрудник) --- */
function openBookingEdit(code,opts){
  opts=opts||{};
  const b=DB.bookings.find(x=>x.code===code);if(!b)return;
  const list=activeServices();
  if(!list.length){toast('Сначала добавьте услуги','err');return;}
  const isStaffView=!!opts.staff;
  const ebsvc=()=>list.map(s=>'<label class="svc-row"><input type="checkbox" data-ebsvc="'+s.id+'"'+(b.services.some(x=>x.id===s.id)?' checked':'')+'><span class="cb">✓</span>'+
    '<span class="n"><b>'+esc(s.name)+'</b><span>≈ '+s.dur+' мин</span></span>'+
    '<span class="p">'+(s.price===0?'0 ₽':fmtMoney(s.price))+'</span></label>').join('');
  const emps=DB.settings.employees.filter(e=>e.active);
  openModal(
    '<div class="m-head"><h3>Изменить запись '+b.code+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body">'+
      '<div class="f-grid">'+
        '<div><label class="lb req">Дата</label><input type="date" id="ebDate" class="inp" min="'+todayISO()+'" value="'+b.date+'"></div>'+
        '<div><label class="lb req">Время</label><select id="ebTime" class="inp"></select></div>'+
        '<div><label class="lb req">Имя</label><input id="ebName" class="inp" value="'+esc(b.name)+'"></div>'+
        '<div><label class="lb req">Телефон</label><input id="ebPhone" class="inp" inputmode="tel" value="'+esc(b.phone)+'"></div>'+
        '<div><label class="lb">Авто</label><input id="ebCar" class="inp" value="'+esc(b.car||'')+'"></div>'+
        '<div><label class="lb">Госномер</label><input id="ebPlate" class="inp" value="'+esc(b.plate||'')+'"></div>'+
        (isStaffView?'':'<div class="full"><label class="lb">Мастер</label><select id="ebEmp" class="inp">'+
          '<option value="auto">Авто (по графику смен)</option>'+
          emps.map(e=>'<option value="'+e.id+'"'+(b.employeeId===e.id?' selected':'')+'>'+esc(e.name)+'</option>').join('')+
        '</select></div>')+
        '<div class="full"><label class="lb">Комментарий</label><input id="ebCom" class="inp" value="'+esc(b.comment||'')+'"></div>'+
      '</div>'+
      '<label class="lb" style="margin-top:14px">Услуги</label>'+
      ebsvc()+
      '<div class="tot"><span class="t2">Итого</span><span id="ebTotal">'+fmtMoney(b.total)+'</span></div>'+
      '<div class="msg warn" id="ebMsg" style="display:none;margin-top:10px"></div>'+
    '</div>'+
    '<div class="m-foot"><button class="btn btn-o" data-mx>Отмена</button><button class="btn btn-p" id="ebSave">Сохранить</button></div>');
  const picks=()=>Array.from($('#modalBox').querySelectorAll('[data-ebsvc]:checked')).map(i=>svcById(i.dataset.ebsvc)).filter(Boolean);
  const ebDur=()=>Math.max(30,picks().reduce((a,s)=>a+s.dur,0));
  const updTot=()=>{$('#ebTotal').textContent=fmtMoney(picks().reduce((a,s)=>a+s.price,0));};
  const loadTimes=()=>{
    const sel=$('#ebTime');const d=$('#ebDate').value;
    const free=freeTimesFor(d,ebDur(),b.code);
    const sameDate=d===b.date;
    const opts2=sameDate&&!free.includes(b.time)?[b.time].concat(free):free;
    sel.innerHTML=opts2.length?opts2.map(t=>'<option value="'+t+'"'+(t===b.time&&sameDate?' selected':'')+'>'+t+(t===b.time&&sameDate?' (текущее)':'')+'</option>').join(''):'<option value="">нет свободных слотов</option>';
    if(sameDate&&opts2.includes(b.time))sel.value=b.time;
  };
  $('#modalBox').querySelectorAll('[data-ebsvc]').forEach(ch=>ch.addEventListener('change',()=>{updTot();loadTimes();}));
  $('#ebDate').addEventListener('change',loadTimes);
  $('#ebPhone').addEventListener('input',e=>phoneMask(e.target));
  loadTimes();
  $('#ebSave').onclick=()=>{
    const msg=$('#ebMsg');msg.style.display='none';
    const err=t=>{msg.textContent=t;msg.style.display='block';};
    const name=$('#ebName').value.trim();
    const date=$('#ebDate').value;const time=$('#ebTime').value;
    const pl=picks();
    if(name.length<2)return err('Укажите имя');
    if(!phoneOk($('#ebPhone').value))return err('Некорректный телефон');
    if(!date)return err('Выберите дату');
    if(!time)return err('Выберите время');
    if(!pl.length)return err('Выберите хотя бы одну услугу');
    const slotChanged=date!==b.date||time!==b.time;
    if(slotChanged&&!slotAvailable(date,time,ebDur(),b.code))return err('Это время уже занято — выберите другое');
    b.name=name;b.phone=$('#ebPhone').value;b.car=$('#ebCar').value.trim();
    b.plate=$('#ebPlate').value.trim().toUpperCase();b.comment=$('#ebCom').value.trim();
    b.services=pl.map(s=>({id:s.id,name:s.name,price:s.price}));
    b.total=pl.reduce((a,s)=>a+s.price,0);
    b.date=date;b.time=time;
    if(!isStaffView&&$('#ebEmp')){
      const v=$('#ebEmp').value;

    }
    save();closeModal();
    if(isStaffView)renderStaff();else renderAdmin();
    toast('Запись '+b.code+' обновлена');
  };
}

function exportCsv(){
  const list=filteredBookings();
  if(!list.length){toast('Нет записей для экспорта','err');return;}
  const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['Код','Дата','Время','Статус','Источник','Клиент','Телефон','Авто','Госномер','Услуги','Мастер','Сумма','Комментарий','Создана'].map(cell).join(';');
  const rows=list.map(b=>[b.code,b.date,b.time,ST[b.status]?ST[b.status].t:b.status,(SRC[b.source]||SRC.online).t,b.name,b.phone,b.car,b.plate,
    b.services.map(s=>s.name).join(', '),(b.employeeId&&empById(b.employeeId)?empById(b.employeeId).name:''),b.total,b.comment,fmtDT(b.createdAt)].map(cell).join(';')).join('\r\n');
  const blob=new Blob(['\ufeff'+head+'\r\n'+rows],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bookings_'+todayISO()+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  toast('CSV выгружен: '+list.length+' записей');
}

const ECAL={month:null};
function renderEmpCal(){
  if(!ECAL.month)ECAL.month=todayISO().slice(0,7);
  const s=DB.settings;
  const [y,m]=ECAL.month.split('-').map(Number);
  const first=new Date(y,m-1,1);
  let monName=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  monName=monName.charAt(0).toUpperCase()+monName.slice(1);
  const startDow=(first.getDay()+6)%7;
  const dim=new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const iso=y+'-'+pad2(m)+'-'+pad2(d);
    const cnt=DB.bookings.filter(b=>b.date===iso&&b.status!=='cancelled').length;
    const e=shiftEmpFor(iso,s);
    const ov=(s.shiftOverrides||{})[iso];
    const flex=e&&e.flex&&e.flex.on&&e.flex.wd.includes(new Date(iso+'T00:00:00').getDay());
    const tag=(ov&&ov!=='auto')?'<span class="st st-swap" style="font-size:9.5px;padding:2px 7px">замена</span>':'<span class="sub" style="font-size:9.5px">'+(flex?'гибкий':'ротация')+'</span>';
    const wdow=(new Date(iso+'T00:00:00').getDay()+6)%7;
    cells+='<button type="button" class="cal-cell'+(wdow>=5?' weekend':'')+(iso===todayISO()?' today':'')+'" data-shday="'+iso+'" title="Смена — редактировать и посмотреть записи">'+
      '<span class="d">'+d+'</span>'+
      '<span class="master" style="color:'+(e?e.color:'var(--dim)')+'">'+(e?esc(e.name.split(' ')[0]):'—')+'</span>'+
      '<span class="cnt">'+(cnt?cnt+' зап.':'свободно')+'</span>'+tag+
    '</button>';
  }
  $('#empCal').innerHTML=
    '<div class="cal-nav">'+
      '<button class="btn btn-o btn-s" data-ecnav="-1">‹</button>'+
      '<b>'+monName+'</b>'+
      '<button class="btn btn-o btn-s" data-ecnav="1">›</button>'+
      '<button class="btn btn-o btn-s" data-ectoday="1">Сегодня</button>'+
      '<span class="sub" style="margin-left:auto">клик по дню — смена и записи</span>'+
    '</div>'+
    '<div class="cal-grid">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<div class="cal-hd">'+x+'</div>').join('')+cells+'</div>';
}
$('#empCal').addEventListener('click',e=>{
  const nav=e.target.closest('[data-ecnav]');
  if(nav){
    const [y,m]=ECAL.month.split('-').map(Number);
    const d=new Date(y,m-1+Number(nav.dataset.ecnav),1);
    ECAL.month=d.getFullYear()+'-'+pad2(d.getMonth()+1);
    renderEmpCal();return;
  }
  if(e.target.closest('[data-ectoday]')){ECAL.month=todayISO().slice(0,7);renderEmpCal();return;}
  const c=e.target.closest('[data-shday]');
  if(c)openShiftModal(c.dataset.shday);
});
function openShiftModal(iso){
  const s=DB.settings;
  const emps=activeEmps();
  const ov=(s.shiftOverrides||{})[iso];
  const cur=shiftEmpFor(iso,s);
  const items=DB.bookings.filter(b=>b.date===iso).sort((a,b)=>a.time.localeCompare(b.time));
  const revDone=items.filter(b=>b.status==='done').reduce((a,b)=>a+(b.total||0),0);
  const revExp=items.filter(b=>b.status==='confirmed').reduce((a,b)=>a+(b.total||0),0);
  openModal(
    '<div class="m-head"><h3>Смена · '+fmtDateHuman(iso)+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body">'+
      '<div class="f-grid">'+
        '<div class="full"><label class="lb">Мастер на эту дату</label><select id="soEmp" class="inp">'+
          '<option value="auto">Авто — по общему графику'+(cur&&(!ov||ov==='auto')?' (сейчас: '+esc(cur.name)+')':'')+'</option>'+
          emps.map(e=>'<option value="'+e.id+'"'+(ov&&Number(ov)===e.id?' selected':'')+'>'+esc(e.name)+'</option>').join('')+
        '</select></div>'+
      '</div>'+
      '<p class="mut-sm">Сейчас на смене: <b>'+(cur?esc(cur.name):'—')+'</b>'+(ov&&ov!=='auto'?' · на эту дату действует <span class="st st-swap">замена</span>':' · замены нет')+'. При замене авто-записи дня перепривязываются к выбранному мастеру.</p>'+
      '<label class="wday" style="margin-top:4px"><input type="checkbox" id="soRebind" checked><span>Перепривязать авто-записи этого дня к выбранному мастеру</span></label>'+
      '<div class="st-stats" style="grid-template-columns:1fr 1fr;margin:14px 0 10px">'+
        '<div class="st-stat"><span>Выполнено за смену</span><b style="color:var(--ok)">'+fmtMoney(revDone)+'</b><i>записей: '+items.filter(b=>b.status==='done').length+'</i></div>'+
        '<div class="st-stat"><span>Ожидается</span><b>'+fmtMoney(revExp)+'</b><i>утверждённые: '+items.filter(b=>b.status==='confirmed').length+'</i></div>'+
      '</div>'+
      '<h3 style="margin-bottom:8px">Записи смены: '+items.length+'</h3>'+
      dayRowsHtml(iso)+
      '<p class="mut-sm" style="margin-top:10px">Нажмите на запись — откроется карточка с подробностями и статусами.</p>'+
    '</div>'+
    '<div class="m-foot"><button class="btn btn-o" data-mx>Закрыть</button><button class="btn btn-p" id="soSave">Сохранить смену</button></div>');
  $('#soSave').onclick=()=>{
    const v=$('#soEmp').value;
    if(v==='auto')delete s.shiftOverrides[iso];else s.shiftOverrides[iso]=Number(v);
    let reb=0;
    if($('#soRebind').checked){
      const master=v==='auto'?shiftEmpFor(iso,s):empById(v);
      if(master)DB.bookings.forEach(b=>{if(b.date===iso&&b.empAuto&&b.employeeId!==master.id){b.employeeId=master.id;reb++;}});
    }
    save();closeModal();
    renderAdmin();
    toast('Смена на '+fmtDateShort(iso)+' сохранена'+(reb?' · перепривязано записей: '+reb:''));
  };
}
function openEmpModal(id){
  const emp=id?empById(id):null;
  const WD=[['Пн',1],['Вт',2],['Ср',3],['Чт',4],['Пт',5],['Сб',6],['Вс',0]];
  const flexOn=emp&&emp.flex&&emp.flex.on&&Array.isArray(emp.flex.wd)&&emp.flex.wd.length;
  const wdSel=d=>flexOn&&emp.flex.wd.includes(d);
  openModal(
    '<div class="m-head"><h3>'+(id?'Изменить сотрудника':'Новый сотрудник')+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body"><div class="f-grid">'+
      '<div class="full"><label class="lb req">Имя</label><input id="emName" class="inp" value="'+(emp?esc(emp.name):'')+'" placeholder="Например: Дмитрий"></div>'+
      '<div><label class="lb req">ПИН-код для входа</label><input id="emPin" class="inp" inputmode="numeric" maxlength="8" value="'+(emp?esc(emp.pin):'')+'" placeholder="1111"></div>'+
      '<div><label class="lb">Цвет метки</label><select id="emColor" class="inp">'+
        ['#60a5fa','#fbbf24','#34d399','#f472b6','#a78bfa','#f87171'].map(c=>'<option value="'+c+'"'+(emp&&emp.color===c?' selected':'')+'>'+c+'</option>').join('')+
      '</select></div>'+
      '<div class="full"><label class="wday" style="margin-top:6px"><input type="checkbox" id="emAct"'+(!emp||emp.active?' checked':'')+'><span>Участвует в графике смен</span></label></div>'+
      '<div class="full"><label class="wday"><input type="checkbox" id="emFlex"'+(flexOn?' checked':'')+'><span>⏱ Гибкий график — закрепить свои дни недели</span></label></div>'+
      '<div class="full" id="emFlexWd"'+(flexOn?'':' style="display:none"')+'>'+
        '<label class="lb">Рабочие дни сотрудника</label>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap">'+WD.map(x=>
          '<label class="chipbtn'+(wdSel(x[1])?' on':'')+'"><input type="checkbox" data-emwd="'+x[1]+'"'+(wdSel(x[1])?' checked':'')+'>'+x[0]+'</label>').join('')+'</div>'+
        '<p class="mut-sm" style="margin-top:6px">В выбранные дни недели смена закреплена за этим сотрудником (если таких несколько — они чередуются по датам). В остальные дни работает общая ротация «через день».</p>'+
      '</div>'+
    '</div></div>'+
    '<div class="m-foot"><button class="btn btn-o" data-mx>Отмена</button><button class="btn btn-p" id="emSave">Сохранить</button></div>');
  $('#emFlex').addEventListener('change',()=>{$('#emFlexWd').style.display=$('#emFlex').checked?'':'none';});
  $$('#modalBox [data-emwd]').forEach(ch=>ch.addEventListener('change',()=>{ch.closest('.chipbtn').classList.toggle('on',ch.checked);}));
  $('#emSave').onclick=()=>{
    const name=$('#emName').value.trim();
    const pin=$('#emPin').value.trim();
    if(name.length<2){toast('Укажите имя','err');return;}
    if(!/^\d{4,8}$/.test(pin)){toast('ПИН — от 4 до 8 цифр','err');return;}
    if(DB.settings.employees.some(x=>x.pin===pin&&(!emp||x.id!==emp.id))){toast('Такой ПИН уже есть у другого сотрудника','err');return;}
    const flexOn2=$('#emFlex').checked;
    const wd=$$('#modalBox [data-emwd]:checked').map(ch=>Number(ch.dataset.emwd));
    if(flexOn2&&!wd.length){toast('Отметьте хотя бы один рабочий день гибкого графика','err');return;}
    const data={name,pin,color:$('#emColor').value,active:$('#emAct').checked,flex:{on:flexOn2,wd:flexOn2?wd:[]}};
    if(emp)Object.assign(emp,data);
    else{
      const nid=DB.settings.employees.reduce((m,x)=>Math.max(m,x.id),0)+1;
      DB.settings.employees.push(Object.assign({id:nid},data));
    }
    if(!activeEmps().length){toast('Нужен хотя бы один активный сотрудник','err');return;}
    const ids=DB.settings.employees.map(x=>x.id);
    if(!ids.includes(Number(DB.settings.shiftFirst)))DB.settings.shiftFirst=DB.settings.employees[0].id;
    save();closeModal();renderEmployees();renderShiftCfg();renderEmpFilter();
    toast(emp?'Данные сотрудника сохранены':'Сотрудник добавлен');
  };
}

$('#impFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.settings||!Array.isArray(d.services)||!Array.isArray(d.bookings))throw new Error('bad');
      DB=d;DB.settings=Object.assign(defaultDB().settings,d.settings);
      normalizeDB(DB);
      save();applySettings();renderServicesGrid();renderAdmin();
      toast('Данные импортированы');
    }catch(err){toast('Файл не похож на резервную копию','err');}
  };
  r.readAsText(f);
  e.target.value='';
});

/* ================= ПАНЕЛЬ СОТРУДНИКА ================= */
const S={empId:null,filter:'today',view:'list',calMonth:null,calDay:null};
const isStaff=()=>{const id=SS.st.getItem('sm_staff');const e=id&&empById(id);return !!(e&&e.active);};
function showStaffLogin(){
  hideViews();$('#staffLogin').hidden=false;
  const emps=activeEmps();
  $('#stEmpChips').innerHTML=emps.length?emps.map((e,i)=>
    '<button class="emp-chip'+(i===0?' on':'')+'" data-stemp="'+e.id+'" style="--ec:'+e.color+'">'+esc(e.name)+'<small>ПИН: '+e.pin.length+' цифр</small></button>').join('')

  $('#stPin').value='';$('#stErr').style.display='none';
}
function enterStaff(msg){
  S.empId=Number(SS.st.getItem('sm_staff'));
  const e=empById(S.empId);
  if(!e||!e.active){SS.st.removeItem('sm_staff');showStaffLogin();return;}
  hideViews();$('#staff').hidden=false;window.scrollTo(0,0);
  renderStaff();
  const fresh=unseenForStaff(e).length;
  if(msg)toast('Здравствуйте, '+e.name+(fresh?'! 🔔 Новых записей: '+fresh:'!'));
}
function staffEmp(){return empById(S.empId);}
/* --- уведомления сотрудника о новых записях --- */
function unseenForStaff(e){
  const seen=(DB.settings.staffSeen||{})[e.id]||0;
  return DB.bookings.filter(b=>b.employeeId===e.id&&b.status!=='cancelled'&&(b.createdAt||0)>seen);
}
function markStaffSeen(){
  const e=staffEmp();if(!e)return;
  DB.settings.staffSeen=DB.settings.staffSeen||{};
  DB.settings.staffSeen[e.id]=Date.now();save();
}
function renderStaff(){
  const e=staffEmp();if(!e){showStaffLogin();return;}
  const t=todayISO();
  const eToday=empOn(t);
  const onShift=eToday&&eToday.id===e.id;
  const fresh=unseenForStaff(e);
  $('#stHead').innerHTML=
    '<div><h2>'+esc(e.name)+' · ваши записи</h2>'+
    '<span class="st-shift'+(onShift?' on':'')+'">'+(onShift?'🔧 Сегодня ваша смена':'😴 Сегодня выходной · работает '+(eToday?esc(eToday.name):'—'))+'</span></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
      '<button class="btn '+(S.view==='cal'?'btn-o':'btn-p')+' btn-s" data-stview="list">📋 Список</button>'+
      '<button class="btn '+(S.view==='cal'?'btn-p':'btn-o')+' btn-s" data-stview="cal">📅 Календарь</button>'+
      '<button class="btn '+(S.filter==='notif'?'btn-p':'btn-o')+' btn-s" data-stact="bell" title="Записи, которые вы ещё не видели">🔔 Новые'+(fresh.length?' <span class="bell-badge">'+fresh.length+'</span>':'')+'</button>'+
      '<button class="btn btn-p btn-s" data-stact="add">+ Записать клиента</button>'+
      (onShift?'<button class="btn btn-o btn-s" data-stact="end" title="Отчёт за смену — PDF, почта и MAX администратору">🏁 Завершить смену</button>':'')+
    '</div>';
  const cal=S.view==='cal';
  if(!cal){
    const wr=weekRange(),mr=monthRange();
    const fact=(label,from,to)=>
      '<div class="st-stat"><span>'+label+'</span><b>'+fmtMoney(revDone(e.id,from,to))+'</b><i>выполнено заказов: '+cntDone(e.id,from,to)+'</i></div>';
    $('#stStats').innerHTML=fact('Факт за день',t,t)+fact('Факт за неделю',wr.from,wr.to)+fact('Факт за месяц',mr.from,mr.to)+
      '<div class="st-stat"><span>Ожидается (утверждено)</span><b style="color:var(--acc2)">'+fmtMoney(expSum(e.id))+'</b><i>записей: '+expCnt(e.id)+'</i></div>';
  }
  $('#stStats').hidden=cal;
  $('#stFilters').hidden=cal;
  $('#stList').hidden=cal;
  $('#stCal').hidden=!cal;
  if(cal)renderStaffCal(e);
  const F=[['today','Сегодня'],['upcoming','Будущие'],['new','Новые'],['notif','🔔 Непросмотренные'],['done','Выполненные'],['all','Все']];
  $('#stFilters').innerHTML=F.map(f=>'<button class="chipbtn'+(S.filter===f[0]?' on':'')+'" data-stf="'+f[0]+'">'+f[1]+'</button>').join('');
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  let items=DB.bookings.filter(b=>b.employeeId===e.id);
  if(S.filter==='today')items=items.filter(b=>b.date===t&&b.status!=='cancelled');
  if(S.filter==='upcoming')items=items.filter(b=>b.date>=t&&b.status!=='cancelled');
  if(S.filter==='new')items=items.filter(b=>b.status==='new');
  if(S.filter==='notif')items=items.filter(b=>S.notifIds&&S.notifIds.has(b.code));
  if(S.filter==='done')items=items.filter(b=>b.status==='done');
  if(S.filter==='notif')items.sort((a,b)=>b.createdAt-a.createdAt);
  else items.sort((a,b)=>(S.filter==='all'?-1:1)*(a.date+a.time).localeCompare(b.date+b.time));
  $('#stList').innerHTML=items.length?items.map(b=>{
    const canAct=b.status==='new'||b.status==='confirmed';
    const act=(b.status==='new'?'<button class="btn btn-ok btn-s" data-sok="'+b.code+'">✓ Подтвердить</button>':'')+
      (b.status==='confirmed'?'<button class="btn btn-p btn-s" data-sdone="'+b.code+'">🏁 Завершить</button>':'')+
      (canAct?'<button class="btn btn-o btn-s" data-sedit="'+b.code+'">✎ Изменить</button>'+
      '<button class="btn btn-d btn-s" data-scancel="'+b.code+'">✗ Отменить</button>':'');
    return '<div class="st-card'+(b.status==='cancelled'?' cancelled':'')+'">'+
      '<div class="row1"><div class="dt">'+fmtDateShort(b.date)+' ('+weekdayRu(b.date)+') · '+b.time+'<small>'+b.code+' · '+(b.source==='phone'?'по телефону':'онлайн')+' · создана '+fmtDT(b.createdAt)+'</small></div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+stBadge(b.status)+'<span class="money">'+fmtMoney(b.total)+'</span></div></div>'+
      '<div class="cl">'+esc(b.name)+' · <a href="tel:'+b.phone.replace(/[^+\d]/g,'')+'">'+esc(b.phone)+'</a>'+(b.car?' · '+esc(b.car):'')+(b.plate?' · '+esc(b.plate):'')+'</div>'+
      '<div class="sv">'+esc(b.services.map(s=>s.name).join(' + '))+' · ≈ '+b.services.reduce((a,s)=>{const x=svcById(s.id);return a+(x?x.dur:30);},0)+' мин</div>'+
      (b.comment?'<div class="sv">💬 '+esc(b.comment)+'</div>':'')+
      noticeLine(b)+
      (act?'<div class="st-acts">'+act+'</div>':'')+
    '</div>';
  }).join(''):'<div class="empty">Записей в этом фильтре нет</div>';
}
/* --- календарный вид: месяц с загруженностью и таймлайн дня --- */
function renderStaffCal(e){
  const s=DB.settings;
  const [y,m]=S.calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const monName=(first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).charAt(0).toUpperCase())+first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).slice(1);
  const startDow=(first.getDay()+6)%7;
  const dim=new Date(y,m,0).getDate();
  const cap=Math.max(60,toMin(s.workEnd)-toMin(s.workStart));
  const durOf=b=>b.services.reduce((a,x)=>{const sv=svcById(x.id);return a+(sv?sv.dur:30);},0);
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const iso=y+'-'+pad2(m)+'-'+pad2(d);
    const items=DB.bookings.filter(b=>b.employeeId===e.id&&b.date===iso&&b.status!=='cancelled');
    const load=Math.min(100,Math.round(items.reduce((a,b)=>a+durOf(b),0)/cap*100));
    const wdow=(new Date(iso+'T00:00:00').getDay()+6)%7;
    cells+='<button type="button" class="cal-cell'+(wdow>=5?' weekend':'')+(iso===todayISO()?' today':'')+(iso===S.calDay?' sel':'')+'" data-calday="'+iso+'">'+
      '<span class="d">'+d+'</span>'+
      (items.length?'<span class="cnt">'+items.length+' запис.</span>':'<span class="cnt" style="color:var(--dim)">свободно</span>')+
      '<span class="loadbar"><i style="width:'+load+'%"></i></span>'+
    '</button>';
  }
  $('#stCal').innerHTML=
    '<div class="cal-nav">'+
      '<button class="btn btn-o btn-s" data-calnav="-1">‹</button>'+
      '<b>'+monName+'</b>'+
      '<button class="btn btn-o btn-s" data-calnav="1">›</button>'+
      '<button class="btn btn-o btn-s" data-caltoday="1">Сегодня</button>'+
      '<span class="sub" style="margin-left:auto">полоска — занятость рабочего дня ('+s.workStart+'–'+s.workEnd+')</span>'+
    '</div>'+
    '<div class="cal-grid">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<div class="cal-hd">'+x+'</div>').join('')+cells+'</div>'+
    (S.calDay?calDayTimeline(e,S.calDay):'<div class="sub" style="margin-top:12px">Выберите день — покажу записи по времени</div>');
}
function calDayTimeline(e,iso){
  const s=DB.settings;
  const items=DB.bookings.filter(b=>b.employeeId===e.id&&b.date===iso&&b.status!=='cancelled').sort((a,b)=>a.time.localeCompare(b.time));
  const rows=items.map(b=>{
    const endM=Math.min(toMin(s.workEnd),toMin(b.time)+b.services.reduce((a,x)=>{const sv=svcById(x.id);return a+(sv?sv.dur:30);},0));
    return '<div class="tl-row'+(b.status==='done'?' done':'')+'"><b class="tl-t">'+b.time+'–'+pad2(Math.floor(endM/60))+':'+pad2(endM%60)+'</b>'+
      '<div style="flex:1;min-width:0"><div>'+esc(b.name)+(b.car?' <span class="sub">· '+esc(b.car)+'</span>':'')+'</div>'+
      '<div class="sub">'+esc(b.services.map(x=>x.name).join(' + '))+' · '+fmtMoney(b.total)+'</div></div>'+
      stBadge(b.status)+'</div>';
  }).join('');
  return '<div style="margin-top:14px"><h3>Загруженность: '+fmtDateHuman(iso)+'</h3>'+
    (rows||'<div class="empty">Записей нет — день свободен</div>')+'</div>';
}
$('#stCal').addEventListener('click',e=>{
  const nav=e.target.closest('[data-calnav]');
  if(nav){
    const [y,m]=S.calMonth.split('-').map(Number);
    const d=new Date(y,m-1+Number(nav.dataset.calnav),1);
    S.calMonth=d.getFullYear()+'-'+pad2(d.getMonth()+1);S.calDay=null;
    renderStaff();return;
  }
  const td=e.target.closest('[data-caltoday]');
  if(td){S.calMonth=todayISO().slice(0,7);S.calDay=todayISO();renderStaff();return;}
  const cd=e.target.closest('[data-calday]');
  if(cd){S.calDay=cd.dataset.calday;renderStaff();}
});
$('#stFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-stf]');if(!b)return;
  S.filter=b.dataset.stf;
  if(S.filter==='notif'){S.notifIds=new Set(unseenForStaff(staffEmp()).map(x=>x.code));markStaffSeen();}
  renderStaff();
});
$('#stHead').addEventListener('click',e=>{
  const v=e.target.closest('[data-stview]');
  if(v){
    S.view=v.dataset.stview;
    if(S.view==='cal'){if(!S.calMonth)S.calMonth=todayISO().slice(0,7);if(!S.calDay)S.calDay=todayISO();}
    renderStaff();return;
  }
  const b=e.target.closest('[data-stact]');if(!b)return;
  if(b.dataset.stact==='add')openManualBooking({staff:true});
  if(b.dataset.stact==='end')openShiftReport();
  if(b.dataset.stact==='bell'){
    S.filter='notif';
    S.notifIds=new Set(unseenForStaff(staffEmp()).map(x=>x.code));
    markStaffSeen();renderStaff();
  }
});
/* --- завершение смены: отчёт (текст, PDF, почта, MAX) --- */
function shiftReportText(e){
  const t=todayISO();const s=DB.settings;
  const items=DB.bookings.filter(b=>b.date===t&&b.employeeId===e.id).sort((a,b)=>a.time.localeCompare(b.time));
  const cnt=st=>items.filter(b=>b.status===st);
  const L=[];
  L.push(s.companyName+' — ОТЧЁТ ЗА СМЕНУ');
  L.push('Мастер: '+e.name);
  L.push('Дата: '+fmtDateShort(t)+' ('+weekdayRu(t)+'), время работы '+s.workStart+'–'+s.workEnd);
  L.push('──────────────────');
  L.push('Записей за смену: '+items.length);
  items.forEach((b,i)=>{
    L.push((i+1)+') '+b.time+' · '+b.name+' · '+(b.phone||'')+(b.car?' · '+b.car:'')+(b.plate?' '+b.plate:''));
    L.push('    Услуги: '+b.services.map(x=>x.name).join(' + ')+' — '+fmtMoney(b.total)+' · '+ST[b.status].t);
    if(b.comment)L.push('    Комментарий: '+b.comment);
  });
  L.push('──────────────────');
  L.push('Выполнено: '+cnt('done').length+' на '+fmtMoney(cnt('done').reduce((a,b)=>a+b.total,0)));
  L.push('Подтверждено (ожидается оплата): '+cnt('confirmed').length+' на '+fmtMoney(cnt('confirmed').reduce((a,b)=>a+b.total,0)));
  L.push('Новых (нужен звонок клиенту): '+cnt('new').length+' · Отменено: '+cnt('cancelled').length);
  L.push('Отчёт сформирован автоматически: '+fmtDT(Date.now()));
  return L.join('\n');
}
function printShiftReport(e){
  const t=todayISO();const s=DB.settings;
  const items=DB.bookings.filter(b=>b.date===t&&b.employeeId===e.id).sort((a,b)=>a.time.localeCompare(b.time));
  const sum=st=>items.filter(b=>b.status===st).reduce((a,b)=>a+b.total,0);
  const rows=items.map(b=>
    '<tr><td class="num">'+b.time+'</td><td><b>'+esc(b.name)+'</b><br><span style="font-size:10pt;color:#444">'+esc(b.phone)+(b.car?' · '+esc(b.car):'')+(b.plate?' · '+esc(b.plate):'')+'</span></td>'+
    '<td>'+esc(b.services.map(x=>x.name).join(' + '))+'</td><td class="price">'+fmtMoney(b.total)+'</td><td>'+ST[b.status].t+'</td></tr>').join('')||
    '<tr><td colspan="5" style="text-align:center;color:#777">Записей за смену нет</td></tr>';
  $('#printSheet').innerHTML=
    '<div class="ps-doc">'+
      '<div class="ps-co">'+esc(s.companyName)+'</div>'+
      '<div class="ps-contacts">'+esc(s.address)+' · тел. '+esc(s.phone)+'</div>'+
      '<h1>Отчёт за смену · '+fmtDateShort(t)+' ('+weekdayRu(t)+')</h1>'+
      '<p style="font-size:11pt">Мастер: <b>'+esc(e.name)+'</b> · время работы: '+s.workStart+'–'+s.workEnd+'</p>'+
      '<table class="ps-table"><thead><tr><th class="num">Время</th><th>Клиент</th><th>Услуги</th><th class="price">Сумма</th><th>Статус</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<table class="ps-table" style="margin-top:10px"><tbody>'+
        '<tr><td>Выполнено</td><td class="price">'+items.filter(b=>b.status==='done').length+' × '+fmtMoney(sum('done'))+'</td></tr>'+
        '<tr><td>Подтверждено (ожидается оплата)</td><td class="price">'+items.filter(b=>b.status==='confirmed').length+' × '+fmtMoney(sum('confirmed'))+'</td></tr>'+
        '<tr><td>Новые / отменённые</td><td class="price">'+items.filter(b=>b.status==='new').length+' / '+items.filter(b=>b.status==='cancelled').length+'</td></tr>'+
      '</tbody></table>'+
      '<div class="ps-foot"><div class="ps-sign"><div class="ln">Мастер ______________________ /'+esc(e.name)+'/<br><span style="font-size:9pt;color:#555">подпись</span></div></div></div>'+
    '</div>';
  window.print();
}
function sendMaxReport(text,btn){
  const url=(DB.settings.smsWebhook||'').trim();
  if(!url){toast('MAX-шлюз не настроен — Настройки → «Уведомления клиентам»','err');return;}
  if(btn){btn.disabled=true;btn.textContent='Отправка…';}
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({channel:'max',phone:DB.settings.phone,text:text,code:'shift-report',kind:'shift-report'})})
    .then(r=>{
      toast(r.ok?'💬 Отчёт отправлен администратору в MAX':'Шлюз вернул ошибку при отправке в MAX',r.ok?'':'err');
      if(btn){btn.disabled=false;btn.textContent='💬 Отправить в MAX';}
    })
    .catch(()=>{
      toast('Не удалось связаться со шлюзом MAX','err');
      if(btn){btn.disabled=false;btn.textContent='💬 Отправить в MAX';}
    });
}
function mailReport(text,e){
  const em=(DB.settings.reportEmail||'').trim();
  if(!em){toast('Укажите почту для отчётов — Настройки → «Данные автосервиса»','err');return;}
  location.href='mailto:'+em+'?subject='+encodeURIComponent('Отчёт за смену '+fmtDateShort(todayISO())+' — '+e.name)+'&body='+encodeURIComponent(text);
}
function openShiftReport(){
  const e=staffEmp();if(!e)return;
  const t=todayISO();
  const text=shiftReportText(e);
  const items=DB.bookings.filter(b=>b.date===t&&b.employeeId===e.id);
  const hasMail=!!(DB.settings.reportEmail||'').trim();
  const hasHook=!!(DB.settings.smsWebhook||'').trim();
  openModal(
    '<div class="m-head"><h3>🏁 Завершение смены · '+fmtDateShort(t)+'</h3><button class="m-x" data-mx>×</button></div>'+
    '<div class="m-body">'+
      '<p class="mut-sm">Смена мастера <b>'+esc(e.name)+'</b>, записей за день: '+items.length+'. '+
        (hasHook?'Отчёт отправлен в MAX администратору. ':'MAX-шлюз не настроен — отправьте кнопкой «💬 Отправить в MAX». ')+
        (hasMail?'Почтовый клиент открыт с письмом для '+esc(DB.settings.reportEmail)+'.':'Почта для отчётов не указана (Настройки → «Данные автосервиса»).')+'</p>'+
      '<pre style="white-space:pre-wrap;font-size:12.5px;line-height:1.5;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:260px;overflow:auto;margin:10px 0">'+esc(text)+'</pre>'+
      '<p class="mut-sm">PDF: в диалоге печати браузера выберите «Сохранить как PDF».</p>'+
    '</div>'+
    '<div class="m-foot" style="flex-wrap:wrap">'+
      '<button class="btn btn-p" id="srPdf">📄 PDF</button>'+
      '<button class="btn btn-o" id="srMail">✉️ На почту</button>'+
      '<button class="btn btn-o" id="srMax">💬 Отправить в MAX</button>'+
      '<button class="btn btn-o" data-mx>Закрыть</button>'+
    '</div>');
  $('#srPdf').onclick=()=>printShiftReport(e);
  $('#srMail').onclick=()=>mailReport(text,e);
  $('#srMax').onclick=ev=>sendMaxReport(text,ev.currentTarget);
  if(hasHook)sendMaxReport(text,null);
  if(hasMail)mailReport(text,e);
}
$('#stList').addEventListener('click',e=>{
  const ok=e.target.closest('[data-sok]'),dn=e.target.closest('[data-sdone]'),ed=e.target.closest('[data-sedit]'),cn=e.target.closest('[data-scancel]');
  const code=(ok&&ok.dataset.sok)||(dn&&dn.dataset.sdone)||(ed&&ed.dataset.sedit)||(cn&&cn.dataset.scancel);
  const b=DB.bookings.find(x=>x.code===code);if(!b)return;
  if(ok){b.status='confirmed';notifyClient(b,'confirmed');save();renderStaff();toast(b.code+' подтверждена · клиенту отправлено '+clientChannel());}
  if(dn){b.status='done';save();renderStaff();toast(b.code+' выполнена — молодец!');}
  if(ed)openBookingEdit(b.code,{staff:true});
  if(cn){openConfirm('Отменить запись?','Запись <b>'+b.code+'</b> ('+esc(b.name)+') на '+fmtDateHuman(b.date)+', '+b.time+' будет отменена, клиент получит уведомление.','Отменить',()=>{
    b.status='cancelled';notifyClient(b,'cancelled');save();renderStaff();toast('Запись отменена · клиент уведомлён');});}
});
$('#stEmpChips').addEventListener('click',e=>{
  const c=e.target.closest('[data-stemp]');if(!c)return;
  $$('#stEmpChips .emp-chip').forEach(x=>x.classList.toggle('on',x===c));
});
function staffLogin(){
  const chips=$$('#stEmpChips .emp-chip');
  const sel=chips.find(x=>x.classList.contains('on'));
  if(!sel){toast('Выберите сотрудника','err');return;}
  const emp=empById(sel.dataset.stemp);
  if(!emp||!emp.active){toast('Сотрудник неактивен','err');return;}
  if($('#stPin').value!==emp.pin){$('#stErr').style.display='block';return;}
  $('#stPin').value='';$('#stErr').style.display='none';
  SS.st.setItem('sm_staff',String(emp.id));
  ensureNotifPerm();
  enterStaff(true);
}
$('#stLoginBtn').addEventListener('click',staffLogin);
$('#stPin').addEventListener('keydown',e=>{if(e.key==='Enter')staffLogin();});
$('#stBack').addEventListener('click',showSite);
$('#stSite').addEventListener('click',showSite);
$('#stLogout').addEventListener('click',()=>{SS.st.removeItem('sm_staff');showSite();toast('Вы вышли из панели');});

/* --- входы --- */
$('#adminBtn').addEventListener('click',()=>{isAdmin()?enterAdmin(true):showLogin();});
$('#adminBtn2').addEventListener('click',e=>{e.preventDefault();isAdmin()?enterAdmin(true):showLogin();});
$('#loginBack').addEventListener('click',showSite);
$('#loginStaff').addEventListener('click',e=>{e.preventDefault();showStaffLogin();});
$('#staffLink').addEventListener('click',e=>{e.preventDefault();showStaffLogin();});
$('#mStaffLink').addEventListener('click',e=>{e.preventDefault();$('#mnav').classList.remove('open');showStaffLogin();});
$('#loginBtn').addEventListener('click',()=>{
  if($('#loginPass').value===DB.settings.adminPass){$('#loginPass').value='';$('#loginErr').style.display='none';SS.st.setItem('sm_admin','1');ensureNotifPerm();enterAdmin(true);}
  else $('#loginErr').style.display='block';
});
$('#loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click();});
$('#aSite').addEventListener('click',showSite);
$('#aLogout').addEventListener('click',logout);
$('#burgerBtn').addEventListener('click',()=>$('#mnav').classList.toggle('open'));
$$('#mnav a').forEach(a=>a.addEventListener('click',()=>$('#mnav').classList.remove('open')));
$('#ftYear').textContent=new Date().getFullYear();

applySettings();
renderServicesGrid();
renderStep();
if(isAdmin())enterAdmin(false);
if(isStaff())enterStaff(false);
/* Межвкладочные обновления: если клиент записался в другой вкладке этого браузера
   (localStorage общий), админка и панель сотрудника перечитывают данные, а
   notifWatch() показывает пуш-уведомление со звуком о новой записи. */
window.addEventListener('storage',e=>{
  if(e.key&&e.key!==LS_KEY)return;
  DB=loadDB();
  notifWatch();
  if(!document.querySelector('.modal-box')){
    if(isStaff())renderStaff();
    if(isAdmin())renderAdmin();
  }
});
/* Если хранилище недоступно (например, изолированный предпросмотр) — предупреждаем,
   что данные не сохранятся, вместо того чтобы молча терять записи. */
if(!LS.ok){
  const n=document.createElement('div');
  n.className='msg warn';
  n.style.cssText='position:fixed;left:12px;bottom:12px;z-index:210;max-width:340px;font-size:12.5px;box-shadow:var(--sh)';
  n.textContent='Предпросмотр без доступа к хранилищу браузера: сайт и админка работают, но данные не сохранятся после закрытия. Откройте сайт по обычной ссылке — всё будет сохраняться.';
  document.body.appendChild(n);
  setTimeout(()=>n.remove(),15000);
}
</script>
